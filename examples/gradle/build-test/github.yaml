# =============================================================================
# EXAMPLE: Plain GitHub-native caller for the reusable build-test workflow
# =============================================================================
# Copy this file into your project's .github/workflows/ directory (for
# example as build-test.yaml) and adjust the `uses:` ref and the optional
# `with:` overrides to suit your project.
#
# This is the GitHub-native form: it runs on pull requests, exactly like a
# standard GitHub project. For projects where Gerrit is the source of truth,
# use the gerrit.yaml example in this directory instead.
# =============================================================================
name: 'Build/Test'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - master

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  build-test:
    name: 'Build/Test'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    # REPLACE the pinned SHA below with a java-workflows release SHA
    # (or your instantiated workflows repository's release SHA).
    # The all-zero SHA is a non-functional placeholder, NOT a real commit.
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/java-workflows/.github/workflows/gradle-build-test.yaml@0000000000000000000000000000000000000000  # REPLACE: vX.Y.Z
    # All inputs are optional. Uncomment and tune only what your project
    # needs; everything else falls back to sensible defaults.
    # with:
    #   path_prefix: '.'              # project root (monorepo subdir, etc.)
    #   java_version: '21'            # override auto-detected JDK version
    #   gradle_version: '8.10'        # pin Gradle (empty uses the wrapper)
    #   build_arguments: 'build'      # arguments for the gradle invocation
    #   test_permit_fail: false       # soft-fail tests
    #   sbom_enabled: true            # false skips SBOM generation
    #   grype_enabled: true           # false skips the Grype scan only
    #   grype_fail_on: 'medium'       # Grype severity gate
    #   harden_runner_egress: 'block' # 'block' (default) or 'audit'
    #   build_timeout_minutes: 45     # raise for large reactors
    #   tests_timeout_minutes: 30     # test report rendering
    #   sbom_timeout_minutes: 30      # SBOM generation
    #   grype_timeout_minutes: 30     # Grype scan
    #
    # Keep the packaged build output from each module's build/libs
    # directory. Off by default; turn it on where a later job or a
    # human needs the jars.
    #   upload_build_artifacts: true
    #   build_artifact_retention_days: 7
