# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Exercises the reusable Maven and Gradle build/test (verify) workflows
# in this repository against downstream fixture repositories. The
# reusable workflows are referenced by LOCAL path so this always
# validates the current branch's workflows.
#
# The functional self-test runs on workflow_dispatch ONLY (there is no
# pull_request trigger) while one prerequisite is pending:
#   1. Dedicated lightweight fixtures (test-maven-project /
#      test-gradle-project) exist; the placeholders below build large
#      upstream projects and are suitable for a manual run only.
# The two earlier prerequisites are satisfied: every building-block
# action is pinned to a published release, and the toolchain egress
# (Maven Central, Gradle distribution, Temurin, and the syft and grype
# tool downloads) is in the central harden-runner allow-list as of
# .github v0.7.0. Trigger it manually to validate a candidate branch.
# Once the dedicated fixtures land, add a pull_request trigger so the
# self-test guards every change automatically.
#
# The planned merge and release lanes are not self-tested here: merge
# requires a merged-commit context and release requires a signed semver
# tag-push context; neither is available or safe on a pull request.
# Instantiating repos validate those through their own cycles.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  # Manual self-test of the Maven verify lane. Audit egress because the
  # placeholder fixture builds a large upstream project whose full egress
  # footprint exceeds the allow-listed toolchain set; a dedicated fixture
  # with a known footprint can switch this to block mode.
  # TODO: repoint to a lightweight test-maven-project fixture.
  maven-build-test:
    name: 'Maven Build/Test'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: ./.github/workflows/maven-build-test.yaml
    with:
      repository: 'apache/maven'
      # Pin a known-good tag so the manual self-test is repeatable and an
      # upstream change cannot make this workflow appear broken.
      ref: 'maven-3.9.9'
      harden_runner_egress: 'audit'

  # Manual self-test of the Gradle verify lane.
  # TODO: repoint to a lightweight test-gradle-project fixture.
  gradle-build-test:
    name: 'Gradle Build/Test'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: ./.github/workflows/gradle-build-test.yaml
    with:
      repository: 'onap/portal-ng-preferences'
      # Pin a known-good commit so the manual self-test is repeatable.
      ref: '2796448b11c66b536ecf1bd0c8ae2271606e85a7'
      harden_runner_egress: 'audit'
