---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Exercises the reusable Maven and Gradle build/test (verify) workflows
# in this repository against downstream fixture repositories. The
# reusable workflows are referenced with the self-repository form
# ('$/'), which resolves this repository at the commit already
# running, so the workflows under test are always the ones this
# branch defines.
#
# The self-test guards every pull request. Both lanes build dedicated
# lightweight fixtures, lfreleng-actions/test-maven-project and
# lfreleng-actions/test-gradle-project, under block egress.
#
# The planned merge and release lanes are not self-tested here: merge
# requires a merged-commit context and release requires a signed semver
# tag-push context; neither is available or safe on a pull request.
# Instantiating repos validate those through their own cycles.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  # No workflow_dispatch: a manual run happens on the default branch,
  # which would hand this job a cache token with write access to the
  # default-branch scope while it builds and tests third-party
  # consumer repositories. Untrusted code from those repositories
  # could then poison caches that later runs restore (CWE-349).
  # Pull request runs write only to their own cache scope.
  pull_request:
    branches: ['main']

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  # Self-test of the Maven verify lane against the dedicated fixture.
  # The fixture is a three-module reactor (parent/core/app) depending
  # only on JUnit and Jackson from Maven Central, so its egress footprint
  # is the allow-listed toolchain set and block mode applies. Its
  # Failing*Test classes stay out of this build: the fixture's parent
  # POM excludes them unless the failing-tests profile is active.
  maven-build-test:
    name: 'Maven Build/Test'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/maven-build-test.yaml
    with:
      repository: 'lfreleng-actions/test-maven-project'
      # Drive mvn_opts and env_vars down a non-default path whose
      # effect the pass-through-check job below can observe, on the
      # build side and on the SBOM side. Neither changes the fixture's
      # graph or egress. mvn_opts sets a marker property surefire
      # records in its reports, and drops the SBOM serial number.
      # env_vars carries MAVEN_OPTS, whose system properties rename
      # the surefire reports and retype the SBOM's root component.
      # './pom.xml' is the root POM with a prefix the SBOM POM guard
      # strips, running its accept path live; maven-pom-test observes
      # the build side of mvn_pom_file. The fixture carries a
      # submodule, which submodule-check proves this call checked out.
      checkout_submodules: true
      # yamllint disable-line rule:line-length
      mvn_opts: '-Dmaven.repo.local=/tmp/m2 -Djava.workflows.mvn.opts=forwarded -DincludeBomSerialNumber=false'
      mvn_pom_file: './pom.xml'
      # yamllint disable-line rule:line-length
      env_vars: '{"MAVEN_OPTS": "-Dsurefire.reportNameSuffix=env-vars -DprojectType=application"}'

  # Proves the Maven lane's pass-through inputs reach both Maven runs:
  # the build, through the JUnit reports it uploads, and the SBOM
  # step, through the document it generates. Each value set above
  # leaves a mark there, and dropping the wiring removes it.
  pass-through-check:
    name: 'Pass-through Check'
    needs: maven-build-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@ac32415b91e0b6db1166bc451024c472cdbcbd3d'  # v0.16.8
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download JUnit reports'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: maven-junit-reports
          path: junit-reports
      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom-files-maven
          path: sbom

      - name: 'Assert the inputs reached both Maven runs'
        shell: bash
        run: |
          set -euo pipefail
          status=0
          fail() { echo "::error::$1"; status=1; }
          marker='name="java.workflows.mvn.opts" value="forwarded"'
          if ! grep -rqF "${marker}" junit-reports; then
            fail 'mvn_opts did not reach the build'
          fi
          if ! find junit-reports -name 'TEST-*-env-vars.xml' | grep -q .
          then
            fail 'env_vars did not reach the build'
          fi
          sbom='sbom/sbom-cyclonedx.json'
          if jq -e 'has("serialNumber")' "${sbom}" > /dev/null; then
            fail 'mvn_opts did not reach the SBOM step'
          fi
          type="$(jq -r '.metadata.component.type // ""' "${sbom}")"
          if [ "${type}" != 'application' ]; then
            fail "env_vars did not reach the SBOM step (type '${type}')"
          fi
          exit "${status}"

  # Observes mvn_pom_file end to end: build core/pom.xml on its own,
  # which packages core and not app, where the root POM (the wiring
  # dropped) packages both. The SBOM POM guard rejects any POM other
  # than pom.xml, so it stays off here; wiring-check runs that
  # rejection. A job calling a reusable workflow cannot set
  # continue-on-error, so a live rejection would fail this run. Tests,
  # JaCoCo and the CBOM stay off too, so this call uploads none of the
  # artefact names the call above does: download-artifact resolves a
  # name to the newest upload, and the checks reading those would race
  # this one.
  maven-pom-test:
    name: 'Maven Build/Test (alternate POM)'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/maven-build-test.yaml
    with:
      repository: 'lfreleng-actions/test-maven-project'
      mvn_pom_file: 'core/pom.xml'
      mvn_params: '-DskipTests'
      run_jacoco: false
      sbom_enabled: false
      grype_enabled: false
      cbom_enabled: false
      upload_build_artifacts: true

  pom-check:
    name: 'POM Check'
    needs: maven-pom-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@ac32415b91e0b6db1166bc451024c472cdbcbd3d'  # v0.16.8
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download build artefacts'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: maven-build-artifacts-reactor
          path: build-artifacts

      - name: 'Assert the build ran the selected POM'
        shell: bash
        run: |
          set -euo pipefail
          status=0
          find build-artifacts -type f | sort
          if ! find build-artifacts -name 'test-maven-core-*.jar' \
            | grep -q .; then
            echo '::error::core/pom.xml built no test-maven-core jar'
            status=1
          fi
          if find build-artifacts -name 'test-maven-app-*.jar' \
            | grep -q .; then
            echo '::error::the build packaged app, so it ran the root' \
              'POM rather than mvn_pom_file'
            status=1
          fi
          exit "${status}"

  # Exercises what the fixtures cannot: the guard steps' rejection
  # paths, the Gerrit submodule initialisation, and the submodule
  # wiring of every checkout in both lanes. It is the structural guard;
  # submodule-check below is the behavioural one, and needs a lane run.
  # The guard scripts run as extracted from the workflows on this
  # branch, so a change to either shows up here.
  wiring-check:
    name: 'Wiring Check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@ac32415b91e0b6db1166bc451024c472cdbcbd3d'  # v0.16.8
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Check the guards and the submodule wiring'
        shell: bash
        run: bash .github/scripts/wiring-check.sh

  # Proves each lane's SBOM comes from the resolved dependency graph.
  # Without this the self-test stays green whatever the SBOM contains:
  # the Maven fixture has no known vulnerabilities for Grype to find,
  # and the Gradle lane cannot tell an empty document from a clean one
  # (issues #47 and #48). Each row names one dependency declared with
  # no version of its own, taking it from an imported BOM, and one
  # reached only transitively. A static scan can produce neither with a
  # version, so both present and versioned means the graph was
  # resolved.
  sbom-check:
    name: 'SBOM Check (${{ matrix.lane }})'
    needs: [maven-build-test, gradle-build-test]
    # Runs whatever the lanes' verdicts. A lane fails on any job,
    # Grype included, and gating on that would let a CVE in a fixture
    # hide the very check that proves the SBOM is complete. A row whose
    # SBOM never uploaded still fails, at the download.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          # test-maven-project: core declares jackson-databind, versioned
          # by jackson-bom, which pulls in jackson-core.
          - lane: 'maven'
            expect: >-
              com.fasterxml.jackson.core:jackson-databind
              com.fasterxml.jackson.core:jackson-core
          # test-gradle-project: core declares jackson-databind, versioned
          # by the jackson-bom platform, which pulls in jackson-core.
          - lane: 'gradle'
            expect: >-
              com.fasterxml.jackson.core:jackson-databind
              com.fasterxml.jackson.core:jackson-core
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@ac32415b91e0b6db1166bc451024c472cdbcbd3d'  # v0.16.8
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom-files-${{ matrix.lane }}

      - name: 'Assert resolved dependencies'
        shell: bash
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          set -euo pipefail
          sbom='sbom-cyclonedx.json'
          status=0
          for coordinate in ${EXPECT}; do
            version="$(jq -r --arg g "${coordinate%%:*}" \
              --arg a "${coordinate#*:}" \
              '[.components[]? | select(.group == $g and .name == $a)
                | .version // ""] | first // ""' "${sbom}")"
            if [ -z "${version}" ] || [ "${version}" = 'UNKNOWN' ]; then
              echo "::error::${coordinate} missing or unversioned in ${sbom}"
              status=1
            else
              echo "${coordinate} ${version}"
            fi
          done
          echo "Components: $(jq '.components | length' "${sbom}")"
          exit "${status}"

  # Proves checkout_submodules takes effect in each lane, which
  # wiring-check cannot: it sees the wiring, not whether a checkout
  # fetched anything. Each fixture carries a submodule, and its
  # SubmoduleTest reads a file from it: passed when the checkout
  # fetched it, failed on the wrong content, skipped when the
  # directory is empty. A skip fails this check, so dropping the
  # wiring or setting checkout_submodules false turns the run red.
  # Runs whatever the lanes' verdicts, as sbom-check does; a lane with
  # no reports still fails, at the download.
  submodule-check:
    name: 'Submodule Check (${{ matrix.lane }})'
    needs: [maven-build-test, gradle-build-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: ['maven', 'gradle']
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@ac32415b91e0b6db1166bc451024c472cdbcbd3d'  # v0.16.8
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # For the check script only; the fixture is not checked out here.
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Download JUnit reports'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ matrix.lane }}-junit-reports
          path: junit-reports

      - name: 'Assert the submodule reached the build'
        shell: bash
        run: python3 .github/scripts/submodule-check.py junit-reports

  # Self-test of the Gradle verify lane against the dedicated fixture:
  # a multi-project build (core, app, and app:nested a level below)
  # mixing the Groovy and Kotlin DSLs, depending only on JUnit, Jackson
  # and Commons Lang from Maven Central. Its egress footprint is the
  # allow-listed toolchain set, so block mode applies, as in the Maven
  # lane. Its Failing*Test classes stay out of this build: the root
  # script excludes them unless -PfailingTests is set.
  gradle-build-test:
    name: 'Gradle Build/Test'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/gradle-build-test.yaml
    with:
      repository: 'lfreleng-actions/test-gradle-project'
      # The fixture carries a submodule, which submodule-check proves
      # this call checked out.
      checkout_submodules: true
