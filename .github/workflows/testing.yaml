---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Exercises the reusable Maven and Gradle build/test (verify) workflows
# in this repository against downstream fixture repositories. The
# reusable workflows are referenced with the self-repository form
# ('$/'), which resolves this repository at the commit already
# running, so the workflows under test are always the ones this
# branch defines.
#
# The self-test guards every pull request. Both lanes build dedicated
# lightweight fixtures, lfreleng-actions/test-maven-project and
# lfreleng-actions/test-gradle-project, under block egress.
#
# The Maven merge lane runs with dry_run against a real Nexus, so it
# publishes nothing and needs no secrets. The planned release lane is
# not self-tested here: it requires a signed semver tag-push context,
# which is neither available nor safe on a pull request.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  # No workflow_dispatch: a manual run happens on the default branch,
  # which would hand this job a cache token with write access to the
  # default-branch scope while it builds and tests third-party
  # consumer repositories. Untrusted code from those repositories
  # could then poison caches that later runs restore (CWE-349).
  # Pull request runs write only to their own cache scope.
  pull_request:
    branches: ['main']

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  # Self-test of the Maven verify lane against the dedicated fixture.
  # The fixture is a three-module reactor (parent/core/app) depending
  # only on JUnit and Jackson from Maven Central, so its egress footprint
  # is the allow-listed toolchain set and block mode applies. Its
  # Failing*Test classes stay out of this build: the fixture's parent
  # POM excludes them unless the failing-tests profile is active.
  maven-build-test:
    name: 'Maven Build/Test'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/maven-build-test.yaml
    with:
      repository: 'lfreleng-actions/test-maven-project'
      # Drive mvn_opts and env_vars down a non-default path whose
      # effect the pass-through-check job below can observe, on the
      # build side and on the SBOM side. Neither changes the fixture's
      # graph or egress. mvn_opts sets a marker property surefire
      # records in its reports, and drops the SBOM serial number.
      # env_vars carries MAVEN_OPTS, whose system properties rename
      # the surefire reports and retype the SBOM's root component.
      # './pom.xml' is the root POM with a prefix the SBOM POM guard
      # strips, running its accept path live; maven-pom-test observes
      # the build side of mvn_pom_file. The fixture carries a
      # submodule, which submodule-check proves this call checked out.
      checkout_submodules: true
      # yamllint disable-line rule:line-length
      mvn_opts: '-Dmaven.repo.local=/tmp/m2 -Djava.workflows.mvn.opts=forwarded -DincludeBomSerialNumber=false'
      mvn_pom_file: './pom.xml'
      # yamllint disable-line rule:line-length
      env_vars: '{"MAVEN_OPTS": "-Dsurefire.reportNameSuffix=env-vars -DprojectType=application"}'

  # Proves the Maven lane's pass-through inputs reach both Maven runs:
  # the build, through the JUnit reports it uploads, and the SBOM
  # step, through the document it generates. Each value set above
  # leaves a mark there, and dropping the wiring removes it.
  pass-through-check:
    name: 'Pass-through Check'
    needs: maven-build-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download JUnit reports'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: maven-junit-reports
          path: junit-reports
      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom-files-maven
          path: sbom

      - name: 'Assert the inputs reached both Maven runs'
        shell: bash
        run: |
          set -euo pipefail
          status=0
          fail() { echo "::error::$1"; status=1; }
          marker='name="java.workflows.mvn.opts" value="forwarded"'
          if ! grep -rqF "${marker}" junit-reports; then
            fail 'mvn_opts did not reach the build'
          fi
          if ! find junit-reports -name 'TEST-*-env-vars.xml' | grep -q .
          then
            fail 'env_vars did not reach the build'
          fi
          sbom='sbom/sbom-cyclonedx.json'
          if jq -e 'has("serialNumber")' "${sbom}" > /dev/null; then
            fail 'mvn_opts did not reach the SBOM step'
          fi
          type="$(jq -r '.metadata.component.type // ""' "${sbom}")"
          if [ "${type}" != 'application' ]; then
            fail "env_vars did not reach the SBOM step (type '${type}')"
          fi
          exit "${status}"

  # Self-test of the Maven merge lane. Jobs share no localhost, so a
  # mock Nexus cannot serve the reusable workflow's build job; the
  # metadata fetch reads ONAP's Nexus instead, which serves its
  # snapshot repository anonymously and has never held the fixture's
  # org.lfreleng.test group, so every module takes the first-publish
  # path. dry_run makes the publish job log its uploads, with no
  # credential and no network request. Whether the buildNumber carries
  # on from published metadata is maven-snapshot-metadata-action's own
  # end-to-end tests' to prove, on Maven 3.9 and Maven 4.
  #
  # env_vars carries MAVEN_OPTS, so the lane's own export runs, and
  # merge-env-check below can observe it. Its system property retypes
  # the SBOM's root component, and changes neither the fixture's graph
  # nor what the lane deploys.
  maven-merge:
    name: 'Maven Merge'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/maven-merge.yaml
    with:
      repository: 'lfreleng-actions/test-maven-project'
      nexus_server: 'https://nexus.onap.org'
      repository_name: 'snapshots'
      dry_run: true
      env_vars: '{"MAVEN_OPTS": "-DprojectType=application"}'

  # Proves the merge lane deployed a publishable tree and handed all
  # of it to the publish step: each fixture module's timestamped
  # SNAPSHOT at buildNumber 1 with its version-level metadata, nothing
  # outside the fixture's group, and a dry run covering every file.
  # .github/scripts/merge-check.sh holds the assertions, which
  # compatibility-check runs on every cell of the matrix as well.
  merge-check:
    name: 'Merge Check'
    needs: maven-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # For the check script only; the fixture is not checked out here.
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Download the m2repo'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: maven-merge-m2repo
          path: m2repo

      - name: 'Assert the m2repo and the dry run'
        shell: bash
        env:
          DRY_RUN_COUNT: ${{ needs.maven-merge.outputs.dry_run_count }}
        run: bash .github/scripts/merge-check.sh m2repo "${DRY_RUN_COUNT}"

  # Proves the merge lane exports env_vars itself, ahead of the
  # metadata fetch. maven-build-action exports the same JSON again
  # before the deploy, so the SBOM's mark shows the value reached the
  # build, but would survive the lane's own export being skipped or
  # failing. Only that step's conclusion, read from the run's jobs,
  # proves it ran.
  merge-env-check:
    name: 'Merge Env Check'
    needs: maven-merge
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read  # reads this run's job steps
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom-files-maven-merge
          path: sbom

      # filter=latest reads each job's newest attempt, so a re-run of
      # this job alone still finds the build job that ran before it.
      - name: 'Assert the lane exported env_vars'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=0
          fail() { echo "::error::$1"; status=1; }
          jobs="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs"
          conclusion="$(gh api --paginate \
            "${jobs}?filter=latest&per_page=50" \
            --jq '.jobs[] | select(.name == "Maven Merge / Build")
              | .steps[] | select(.name == "Export env_vars")
              | .conclusion')"
          if [ "${conclusion}" != 'success' ]; then
            step="The merge lane's 'Export env_vars' step"
            fail "${step} concluded '${conclusion:-nothing}', not success"
          fi
          sbom='sbom/sbom-cyclonedx.json'
          type="$(jq -r '.metadata.component.type // ""' "${sbom}")"
          if [ "${type}" != 'application' ]; then
            fail "env_vars did not reach the merge SBOM (type '${type}')"
          fi
          exit "${status}"

  # Proves the merge lane's prune refuses a SNAPSHOT coordinate fetch
  # never read, inside the reactor's own group, where the landed
  # check's group paths cannot see it: what a POM-bound deploy-file
  # writes. A job calling the lane cannot set continue-on-error, so
  # this runs the lane's metadata action itself, at the lane's pin and
  # with its prune settings, which wiring-check holds in step. prune
  # judges the m2repo alone, so the job plants the files a deploy
  # would write rather than deploying. The same tree, less the extra
  # coordinate, then passes, so the failure is that coordinate's.
  merge-prune-check:
    name: 'Merge Prune Check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          # The lane adds its nexus_server endpoint the same way
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
            nexus.onap.org:443

      - name: 'Checkout fixture'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'lfreleng-actions/test-maven-project'
          path: 'fixture'
          persist-credentials: false

      - name: 'Set up Java'
        # yamllint disable-line rule:line-length
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # As the maven-merge job above: ONAP's Nexus has never held the
      # fixture's group, so every module takes the first-publish path.
      - name: 'Fetch published SNAPSHOT metadata'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/maven-snapshot-metadata-action@4e5b8ba2c3f3715f47589ec5db581cdfc431db02  # v0.1.3
        with:
          mode: 'fetch'
          nexus_server: 'https://nexus.onap.org'
          repository_name: 'snapshots'
          path_prefix: 'fixture'

      # A module fetch read, and org.lfreleng.test:extra beside it
      - name: 'Plant a deploy holding an extra coordinate'
        shell: bash
        run: |
          set -euo pipefail
          group="${GITHUB_WORKSPACE}/m2repo/org/lfreleng/test"
          for artifact in test-maven-core extra; do
            dir="${group}/${artifact}/1.0.0-SNAPSHOT"
            mkdir -p "${dir}"
            echo 'jar' > "${dir}/${artifact}-1.0.0-20261008.120000-1.jar"
          done

      - name: 'Prune with the extra coordinate (should fail)'
        id: unrecorded
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/maven-snapshot-metadata-action@4e5b8ba2c3f3715f47589ec5db581cdfc431db02  # v0.1.3
        with:
          mode: 'prune'
          check_coordinates: 'true'

      - name: 'Error if the step above did NOT fail'
        if: steps.unrecorded.outcome != 'failure'
        shell: bash
        run: |
          echo '::error::prune accepted a coordinate fetch did not read'
          exit 1

      # prune refuses before removing anything, so the baseline and the
      # rest of the tree are as they were
      - name: 'Remove the extra coordinate'
        shell: bash
        run: rm -rf -- "${GITHUB_WORKSPACE}/m2repo/org/lfreleng/test/extra"

      - name: 'Prune the reactor alone'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/maven-snapshot-metadata-action@4e5b8ba2c3f3715f47589ec5db581cdfc431db02  # v0.1.3
        with:
          mode: 'prune'
          check_coordinates: 'true'

  # Observes mvn_pom_file end to end: build core/pom.xml on its own,
  # which packages core and not app, where the root POM (the wiring
  # dropped) packages both. The SBOM POM guard rejects any POM other
  # than pom.xml, so it stays off here; wiring-check runs that
  # rejection. A job calling a reusable workflow cannot set
  # continue-on-error, so a live rejection would fail this run. Tests,
  # JaCoCo and the CBOM stay off too, so this call uploads none of the
  # artefact names the call above does: download-artifact resolves a
  # name to the newest upload, and the checks reading those would race
  # this one.
  maven-pom-test:
    name: 'Maven Build/Test (alternate POM)'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/maven-build-test.yaml
    with:
      repository: 'lfreleng-actions/test-maven-project'
      mvn_pom_file: 'core/pom.xml'
      mvn_params: '-DskipTests'
      run_jacoco: false
      sbom_enabled: false
      grype_enabled: false
      cbom_enabled: false
      upload_build_artifacts: true

  pom-check:
    name: 'POM Check'
    needs: maven-pom-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download build artefacts'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          # By the name the lane publishes, as a caller would
          name: ${{ needs.maven-pom-test.outputs.build_artifact_name }}
          path: build-artifacts

      - name: 'Assert the build ran the selected POM'
        shell: bash
        run: |
          set -euo pipefail
          status=0
          find build-artifacts -type f | sort
          if ! find build-artifacts -name 'test-maven-core-*.jar' \
            | grep -q .; then
            echo '::error::core/pom.xml built no test-maven-core jar'
            status=1
          fi
          if find build-artifacts -name 'test-maven-app-*.jar' \
            | grep -q .; then
            echo '::error::the build packaged app, so it ran the root' \
              'POM rather than mvn_pom_file'
            status=1
          fi
          exit "${status}"

  # Runs the Maven lane under grype_gate_when: dependencies-changed
  # against a fixture checked out at a pinned commit, which is not the
  # commit this run is for, so the detector inside
  # repository-metadata-action reports unresolved by its own rules,
  # the verdict reaching Grype is empty, and the gate stays armed: the
  # fail-closed path, which every caller takes on its first run and
  # on any change the detector cannot judge. The
  # resolved paths run below, on this repository's own fixtures.
  # Tests, JaCoCo and the CBOM stay off, as in maven-pom-test, and the
  # suffix keeps this call's artefacts apart from the call above.
  maven-gate-test:
    name: 'Maven Build/Test (Grype gate policy)'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/maven-build-test.yaml
    with:
      repository: 'lfreleng-actions/test-maven-project'
      ref: 'a4a75c32d65719559271b1ab8de03ab585927c34'
      artifact_suffix: '-gate'
      grype_gate_when: 'dependencies-changed'
      mvn_params: '-DskipTests'
      run_jacoco: false
      cbom_enabled: false

  # Proves the unresolved path gates: the lane publishes the
  # dependency-change verdict its Grype job received, empty for an
  # unresolved detection, and the gate verdict grype-scan-action
  # reached; the lane must not fail for the empty verdict.
  gate-check:
    name: 'Grype Gate Check (unresolved)'
    needs: maven-gate-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Assert the unresolved path gated'
        shell: bash
        env:
          RESULT: ${{ needs.maven-gate-test.result }}
          GATE_ACTIVE: ${{ needs.maven-gate-test.outputs.grype_gate_active }}
          GATE_REASON: ${{ needs.maven-gate-test.outputs.grype_gate_reason }}
          # yamllint disable-line rule:line-length
          DEPENDENCIES_CHANGED: ${{ needs.maven-gate-test.outputs.grype_dependencies_changed }}
        run: |
          set -euo pipefail
          status=0
          fail() { echo "::error::$*"; status=1; }
          echo "Lane result: ${RESULT}"
          echo "dependencies-changed: ${DEPENDENCIES_CHANGED}"
          echo "gate-active: ${GATE_ACTIVE}"
          echo "gate-reason: ${GATE_REASON}"
          if [ "${RESULT}" != 'success' ]; then
            fail "the gated lane concluded '${RESULT}', not success"
          fi
          if [ "${GATE_ACTIVE}" != 'true' ]; then
            fail "grype_gate_active is '${GATE_ACTIVE}', not true"
          fi
          if [ -n "${DEPENDENCIES_CHANGED}" ]; then
            fail "an unresolved detection reached Grype as" \
              "'${DEPENDENCIES_CHANGED}', not empty"
          fi
          exit "${status}"

  # The resolved path end to end: both lanes build a fixture in this
  # repository (tests/fixtures/maven and tests/fixtures/gradle), at
  # the commit this run is for. On a pull request of this repository
  # the detector resolves by its own rules: HEAD is the run's commit,
  # the whole-history checkout holds the base, the target branch's
  # tip, and no symbolic link or submodule anywhere in the repository
  # can leave it undecided, which tests/test_grype_gate.py enforces.
  # So a resolved verdict always reaches the Grype job here, and
  # gate-resolved-check holds the lane to what any resolved run must
  # satisfy: a boolean verdict that the lane's grype_gate_active
  # follows. Which verdict the pull request's own diff earns is not
  # re-derived here;
  # gate-verdict-cases below proves each value on a change built for
  # it. The Gradle fixture carries no wrapper, so the lane pins the
  # Gradle it provisions; the version matches the current line in
  # java-maven-versions.yaml.
  maven-gate-resolved:
    name: 'Maven Build/Test (Grype gate resolved)'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/maven-build-test.yaml
    with:
      path_prefix: 'tests/fixtures/maven'
      artifact_suffix: '-gate-resolved'
      grype_gate_when: 'dependencies-changed'
      mvn_params: '-DskipTests'
      run_jacoco: false
      cbom_enabled: false

  gradle-gate-resolved:
    name: 'Gradle Build/Test (Grype gate resolved)'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/gradle-build-test.yaml
    with:
      path_prefix: 'tests/fixtures/gradle'
      gradle_version: '9.8.1'
      artifact_suffix: '-gate-resolved'
      grype_gate_when: 'dependencies-changed'
      cbom_enabled: false

  # Reads each resolved lane's dependency-change verdict, as its
  # Grype job received it, and its gate verdict. On a pull request of
  # this repository the detector resolves (see above), so an empty
  # verdict means it did not reach Grype. The check asserts the lane
  # passed, the verdict is 'true' or 'false', and the lane's
  # grype_gate_active equals it: a Grype step that ignored the
  # verdict, or a verdict that never reached it, fails here. The
  # value is the detector's to decide, and gate-verdict-cases holds
  # it to a known change.
  gate-resolved-check:
    name: 'Grype Gate Check (resolved, ${{ matrix.lane }})'
    needs: [maven-gate-resolved, gradle-gate-resolved]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: 'maven'
            result: ${{ needs.maven-gate-resolved.result }}
            # yamllint disable-line rule:line-length
            gate_active: ${{ needs.maven-gate-resolved.outputs.grype_gate_active }}
            # yamllint disable-line rule:line-length
            gate_reason: ${{ needs.maven-gate-resolved.outputs.grype_gate_reason }}
            # yamllint disable-line rule:line-length
            dependencies_changed: ${{ needs.maven-gate-resolved.outputs.grype_dependencies_changed }}
          - lane: 'gradle'
            result: ${{ needs.gradle-gate-resolved.result }}
            # yamllint disable-line rule:line-length
            gate_active: ${{ needs.gradle-gate-resolved.outputs.grype_gate_active }}
            # yamllint disable-line rule:line-length
            gate_reason: ${{ needs.gradle-gate-resolved.outputs.grype_gate_reason }}
            # yamllint disable-line rule:line-length
            dependencies_changed: ${{ needs.gradle-gate-resolved.outputs.grype_dependencies_changed }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Assert the gate followed the verdict'
        shell: bash
        env:
          LANE_RESULT: ${{ matrix.result }}
          GATE_ACTIVE: ${{ matrix.gate_active }}
          GATE_REASON: ${{ matrix.gate_reason }}
          DEPENDENCIES_CHANGED: ${{ matrix.dependencies_changed }}
        run: |
          set -euo pipefail
          status=0
          fail() { echo "::error::$*"; status=1; }
          echo "Lane result: ${LANE_RESULT}"
          echo "dependencies-changed: ${DEPENDENCIES_CHANGED}"
          echo "gate-active: ${GATE_ACTIVE}"
          echo "gate-reason: ${GATE_REASON}"
          if [ "${LANE_RESULT}" != 'success' ]; then
            fail "the lane concluded '${LANE_RESULT}', not success"
          fi
          changed="${DEPENDENCIES_CHANGED}"
          case "${changed}" in
            true | false) ;;
            *)
              fail "the verdict reaching Grype is '${changed}', not" \
                "true or false: detection did not resolve or reach it"
              exit "${status}" ;;
          esac
          if [ "${GATE_ACTIVE}" != "${changed}" ]; then
            fail "grype_gate_active is '${GATE_ACTIVE}', but the verdict" \
              "reaching Grype is ${changed}"
          fi
          exit "${status}"

  # Each verdict on a change built for it. A case starts a scratch
  # repository in the workspace from a lane's fixture, commits it,
  # then commits one known change: the dependency file at the
  # fixture's root for 'changed', a Java source for 'unchanged'. It
  # runs repository-metadata-action with the lane's detection inputs
  # (every preset, the lane's fixed patterns) and the first commit as
  # the explicit base, then grype-scan-action with the lane's policy
  # over the SBOM the resolved lane built from that fixture, reading
  # the verdict through the same dependencies-changed input. The
  # expected verdict and gate-active are known when the case is
  # written, so no second matcher re-derives them.
  gate-verdict-cases:
    name: 'Grype Gate Verdict (${{ matrix.lane }}, ${{ matrix.case }})'
    needs: [maven-gate-resolved, gradle-gate-resolved]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    strategy:
      fail-fast: false
      matrix:
        lane: ['maven', 'gradle']
        case: ['unchanged', 'changed']
        include:
          - lane: 'maven'
            patterns: '.mvn/jvm.config'
            dependency_file: 'pom.xml'
          - lane: 'gradle'
            patterns: |
              *.gradle
              *.gradle.kts
            dependency_file: 'build.gradle.kts'
          - case: 'unchanged'
            expected: 'false'
          - case: 'changed'
            expected: 'true'
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: source
          persist-credentials: false

      # The scratch repository is the workspace itself, since the
      # detector reads git in the working directory. The checkout is
      # removed before the first commit so no nested repository
      # becomes a gitlink, which the detector would count as a
      # submodule it cannot see through.
      - name: 'Build a known change'
        id: scratch
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          CASE: ${{ matrix.case }}
          DEPENDENCY_FILE: ${{ matrix.dependency_file }}
        run: |
          set -euo pipefail
          cp -R "source/tests/fixtures/${LANE}/." .
          rm -rf source
          git init -q .
          git config user.email 'gate-verdict@example.invalid'
          git config user.name 'gate-verdict'
          git add -A
          git commit -q -m 'base'
          echo "base=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          case "${CASE}" in
            changed) target="${DEPENDENCY_FILE}" ;;
            unchanged)
              target="$(find src -type f -name '*.java' | sort | head -n 1)" ;;
            *) echo "::error::unknown case '${CASE}'"; exit 1 ;;
          esac
          case "${target}" in
            *.xml) marker='<!-- edited by gate-verdict-cases -->' ;;
            *) marker='// edited by gate-verdict-cases' ;;
          esac
          printf '\n%s\n' "${marker}" >> "${target}"
          git commit -q -a -m "${CASE}"
          echo "Base $(git rev-parse HEAD^1), HEAD $(git rev-parse HEAD)"
          git --no-pager diff --stat HEAD^1 HEAD

      # The lanes' metadata step, at their pin, with detection only:
      # no artefact and no summary, which the lanes' own calls cover.
      - name: 'Detect dependency changes'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@f0e5d2d8dc1154a5d702b75acc551eff6ba072dc  # v0.5.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'false'
          artifact_upload: 'false'
          dependency_change: 'true'
          dependency_patterns: ${{ matrix.patterns }}
          dependency_path_prefix: '.'
          dependency_base: ${{ steps.scratch.outputs.base }}

      - name: 'Assert the detector reported the known change'
        shell: bash
        env:
          EXPECTED: ${{ matrix.expected }}
          CASE: ${{ matrix.case }}
          BASE: ${{ steps.scratch.outputs.base }}
          CHANGED: ${{ steps.repo-metadata.outputs.dependencies_changed }}
          # yamllint disable-line rule:line-length
          REASON: ${{ steps.repo-metadata.outputs.dependency_change_reason }}
          GOT_BASE: ${{ steps.repo-metadata.outputs.dependency_change_base }}
        run: |
          set -euo pipefail
          status=0
          fail() { echo "::error::$*"; status=1; }
          echo "dependencies-changed: ${CHANGED}"
          echo "reason: ${REASON}"
          echo "base: ${GOT_BASE}"
          if [ "${CHANGED}" != "${EXPECTED}" ]; then
            fail "dependencies-changed is '${CHANGED}', expected" \
              "${EXPECTED} for the ${CASE} case"
          fi
          case "${REASON}" in
            '' | unresolved*) fail "reason '${REASON}' is not a resolved one" ;;
          esac
          if [ "${GOT_BASE}" != "${BASE}" ]; then
            fail "base is '${GOT_BASE}', not the explicit ${BASE}"
          fi
          exit "${status}"

      # The SBOM the resolved lane built from the same fixture, so the
      # scan below sees what the lane's Grype job saw.
      - name: 'Download the SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom-files-${{ matrix.lane }}-gate-resolved

      # The lane's policy, value for value, at the lane's pin. The
      # database is restored only: four cases run at once, and the
      # lanes' own scans write it.
      - name: 'Grype audit SBOM'
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@f65dca2762823cfc8f376e32fee9baa6f3292696  # v0.6.2
        with:
          sbom: 'sbom-cyclonedx.json'
          fail-on: 'medium'
          gate-when: 'dependencies-changed'
          # yamllint disable-line rule:line-length
          dependencies-changed: ${{ steps.repo-metadata.outputs.dependencies_changed }}
          dependency-policy: 'declared'
          transitive-fail-on: 'critical'
          only-fixed: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-db: 'restore-only'
          upload-artifact: 'false'

      - name: 'Assert the gate followed the known change'
        shell: bash
        env:
          EXPECTED: ${{ matrix.expected }}
          CASE: ${{ matrix.case }}
          GATE_ACTIVE: ${{ steps.grype-audit.outputs.gate-active }}
          GATE_REASON: ${{ steps.grype-audit.outputs.gate-reason }}
        run: |
          set -euo pipefail
          echo "gate-active: ${GATE_ACTIVE}"
          echo "gate-reason: ${GATE_REASON}"
          if [ "${GATE_ACTIVE}" != "${EXPECTED}" ]; then
            echo "::error::gate-active is '${GATE_ACTIVE}', expected" \
              "${EXPECTED} for the ${CASE} case"
            exit 1
          fi
          echo "Grype gate verdict (${CASE}, gate-active=${EXPECTED}) checked ✅"

  # Proves the verify lanes' gerrit-validate job rejects a bad policy
  # value in seconds: the Grype gate's validate-only step, at the
  # lanes' pin with the lanes' default policy and a gate-when the
  # action does not know, must fail. A job calling a lane cannot set
  # continue-on-error, so this runs the action itself, with the lanes'
  # with: block less the lane-input expressions, which wiring-check
  # holds in step. Like the lanes' job it runs that one action, with
  # no checkout and no harden-runner: that validate-only makes no
  # network request is grype-scan-action's contract, which its own
  # repository's validate-only CI job tests, so this job asserts the
  # verdict alone and proves nothing about the network.
  gate-validate-check:
    name: 'Grype Gate Validate Check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 'Validate Grype gate inputs'
        id: validate
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@f65dca2762823cfc8f376e32fee9baa6f3292696  # v0.6.2
        with:
          validate-only: 'true'
          fail-on: 'medium'
          gate-when: 'never'
          dependency-policy: 'declared'
          transitive-fail-on: 'critical'
          only-fixed: 'true'
          remediation-window-days: ''
          remediation-window-start: ''
          bypass-repository: ''

      - name: 'Assert the step rejected the gate-when'
        shell: bash
        env:
          OUTCOME: ${{ steps.validate.outcome }}
          VALIDATED: ${{ steps.validate.outputs.validated }}
        run: |
          set -euo pipefail
          echo "outcome: ${OUTCOME}"
          echo "validated: ${VALIDATED}"
          if [ "${OUTCOME}" != "failure" ]; then
            echo "::error::validate-only ended '${OUTCOME}' on a" \
              "gate-when the action does not know; expected failure"
            exit 1
          fi
          if [ -n "${VALIDATED}" ]; then
            echo "::error::validated is '${VALIDATED}' after a rejection"
            exit 1
          fi
          echo "Grype gate validate-only rejection checked ✅"

  # Proves each build lane publishes its build artefact's name, shape
  # and count as workflow outputs a caller can use, and that the
  # artefact keeps the README's layout contract. Each row downloads the
  # artefact by the name its lane published, as a caller chaining a
  # container build would. maven-build-test uploads nothing, so it
  # holds the shape none to an empty name.
  build-artifact-check:
    name: 'Build Artefact Check (${{ matrix.lane }})'
    needs: [maven-build-test, maven-pom-test, gradle-build-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: 'maven'
            call: 'maven-pom-test'
            # yamllint disable-line rule:line-length
            name: ${{ needs.maven-pom-test.outputs.build_artifact_name }}
            shape: ${{ needs.maven-pom-test.outputs.build_artifact_shape }}
            count: ${{ needs.maven-pom-test.outputs.build_artifact_count }}
            want_name: 'maven-build-artifacts-reactor'
            want_shape: 'reactor'
            expect: 'core/target/test-maven-core-1.0.0-SNAPSHOT.jar'
          - lane: 'maven'
            call: 'maven-build-test'
            # yamllint disable-line rule:line-length
            name: ${{ needs.maven-build-test.outputs.build_artifact_name }}
            # yamllint disable-line rule:line-length
            shape: ${{ needs.maven-build-test.outputs.build_artifact_shape }}
            # yamllint disable-line rule:line-length
            count: ${{ needs.maven-build-test.outputs.build_artifact_count }}
            want_name: ''
            want_shape: 'none'
            expect: ''
          # The nested project keeps its depth below path_prefix
          - lane: 'gradle'
            call: 'gradle-build-test'
            # yamllint disable-line rule:line-length
            name: ${{ needs.gradle-build-test.outputs.build_artifact_name }}
            # yamllint disable-line rule:line-length
            shape: ${{ needs.gradle-build-test.outputs.build_artifact_shape }}
            # yamllint disable-line rule:line-length
            count: ${{ needs.gradle-build-test.outputs.build_artifact_count }}
            want_name: 'gradle-build-artifacts'
            want_shape: 'reactor'
            expect: >-
              core/build/libs/core-1.0.0-SNAPSHOT.jar
              app/build/libs/app-1.0.0-SNAPSHOT.jar
              app/nested/build/libs/nested-1.0.0-SNAPSHOT.jar
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # For the check script only; the fixture is not checked out here.
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Download the build artefact by its published name'
        if: matrix.name != ''
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ matrix.name }}
          path: build-artifact

      - name: 'Assert the outputs and the layout (${{ matrix.call }})'
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          NAME: ${{ matrix.name }}
          SHAPE: ${{ matrix.shape }}
          COUNT: ${{ matrix.count }}
          WANT_NAME: ${{ matrix.want_name }}
          WANT_SHAPE: ${{ matrix.want_shape }}
          EXPECT: ${{ matrix.expect }}
        run: |
          # Passed as published: a lane that stopped publishing an
          # output must fail here, not pass as shape none.
          # shellcheck disable=SC2086  # one argument per expected path
          bash .github/scripts/build-artifact-check.sh "${LANE}" \
            build-artifact "${NAME}" "${SHAPE}" "${COUNT}" \
            "${WANT_NAME}" "${WANT_SHAPE}" ${EXPECT}

  # Exercises what the fixtures cannot: the guard steps' rejection
  # paths, the Gerrit submodule initialisation, the submodule wiring
  # of every checkout in both lanes, and the Grype gate policy's
  # wiring (tests/test_wiring.py and tests/test_grype_gate.py). It is
  # the structural guard; submodule-check below is the behavioural
  # one, and needs a lane run. The guard scripts run as extracted from
  # the workflows on this branch, so a change to either shows up here.
  # Each structural rule also runs against a copy of the workflow with
  # that one thing wrong, so a rule that stops rejecting fails here.
  wiring-check:
    name: 'Wiring Check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The locked interpreter and PyYAML, so the suite reads the
      # workflows as the runner does, without the host's yq.
      - name: 'Set up uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      # The Grype gate policy's tests cover its inputs, their
      # validation, detection in the repository-metadata job and its
      # condition, the checkout depth it needs, the verdict's guarded
      # route to the Grype job, the self-test lanes above, and that
      # gate-verdict-cases runs
      # the two actions with the lanes' own inputs. gate-check,
      # gate-resolved-check and gate-verdict-cases prove the verdicts.
      - name: 'Run the contract tests'
        shell: bash
        run: uv run --locked python -B -m unittest discover -s tests -v

  # Proves each lane's SBOM comes from the resolved dependency graph.
  # Without this the self-test stays green whatever the SBOM contains:
  # the Maven fixture has no known vulnerabilities for Grype to find,
  # and the Gradle lane cannot tell an empty document from a clean one
  # (issues #47 and #48). Each row names one dependency declared with
  # no version of its own, taking it from an imported BOM, and one
  # reached only transitively. A static scan can produce neither with a
  # version, so both present and versioned means the graph was
  # resolved.
  sbom-check:
    name: 'SBOM Check (${{ matrix.lane }})'
    needs: [maven-build-test, gradle-build-test]
    # Runs whatever the lanes' verdicts. A lane fails on any job,
    # Grype included, and gating on that would let a CVE in a fixture
    # hide the very check that proves the SBOM is complete. A row whose
    # SBOM never uploaded still fails, at the download.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          # test-maven-project: core declares jackson-databind, versioned
          # by jackson-bom, which pulls in jackson-core.
          - lane: 'maven'
            expect: >-
              com.fasterxml.jackson.core:jackson-databind
              com.fasterxml.jackson.core:jackson-core
          # test-gradle-project: core declares jackson-databind, versioned
          # by the jackson-bom platform, which pulls in jackson-core.
          - lane: 'gradle'
            expect: >-
              com.fasterxml.jackson.core:jackson-databind
              com.fasterxml.jackson.core:jackson-core
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom-files-${{ matrix.lane }}

      - name: 'Assert resolved dependencies'
        shell: bash
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          set -euo pipefail
          sbom='sbom-cyclonedx.json'
          status=0
          for coordinate in ${EXPECT}; do
            version="$(jq -r --arg g "${coordinate%%:*}" \
              --arg a "${coordinate#*:}" \
              '[.components[]? | select(.group == $g and .name == $a)
                | .version // ""] | first // ""' "${sbom}")"
            if [ -z "${version}" ] || [ "${version}" = 'UNKNOWN' ]; then
              echo "::error::${coordinate} missing or unversioned in ${sbom}"
              status=1
            else
              echo "${coordinate} ${version}"
            fi
          done
          echo "Components: $(jq '.components | length' "${sbom}")"
          exit "${status}"

  # Proves checkout_submodules takes effect in each lane, which
  # wiring-check cannot: it sees the wiring, not whether a checkout
  # fetched anything. Each fixture carries a submodule, and its
  # SubmoduleTest reads a file from it: passed when the checkout
  # fetched it, failed on the wrong content, skipped when the
  # directory is empty. A skip fails this check, so dropping the
  # wiring or setting checkout_submodules false turns the run red.
  # Runs whatever the lanes' verdicts, as sbom-check does; a lane with
  # no reports still fails, at the download.
  submodule-check:
    name: 'Submodule Check (${{ matrix.lane }})'
    needs: [maven-build-test, gradle-build-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: ['maven', 'gradle']
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # For the check script only; the fixture is not checked out here.
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Download JUnit reports'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ matrix.lane }}-junit-reports
          path: junit-reports

      - name: 'Assert the submodule reached the build'
        shell: bash
        run: python3 .github/scripts/submodule-check.py junit-reports

  # Self-test of the Gradle verify lane against the dedicated fixture:
  # a multi-project build (core, app, and app:nested a level below)
  # mixing the Groovy and Kotlin DSLs, depending only on JUnit, Jackson
  # and Commons Lang from Maven Central. Its egress footprint is the
  # allow-listed toolchain set, so block mode applies, as in the Maven
  # lane. Its Failing*Test classes stay out of this build: the root
  # script excludes them unless -PfailingTests is set.
  gradle-build-test:
    name: 'Gradle Build/Test'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/gradle-build-test.yaml
    with:
      repository: 'lfreleng-actions/test-gradle-project'
      # The fixture carries a submodule, which submodule-check proves
      # this call checked out.
      checkout_submodules: true
      # build-artifact-check reads the artefact through the lane's
      # outputs.
      upload_build_artifacts: true
      # Exercise the allow-list inputs without granting anything new.
      # A same-organisation list may follow its default branch, and
      # 'lfreleng-actions//' resolves to the organisation list itself,
      # which de-duplication absorbs. The organisation list already
      # carries github.com:443, so the action reports it as redundant.
      # yamllint disable-line rule:line-length
      # gha-workflow-linter: allow-list-pin-ok -- deliberately unpinned fixture; exercises harden_runner_supplemental_unpinned
      harden_runner_supplemental_allowlist: 'lfreleng-actions//'
      harden_runner_supplemental_unpinned: true
      harden_runner_extra_endpoints: 'github.com:443'

  # The Maven releases and Java versions the estate tests against,
  # from the workflow the Java/Maven repositories are to read them from.
  versions:
    name: 'Java/Maven Versions'
    permissions: {}
    uses: $/.github/workflows/java-maven-versions.yaml

  # Both Maven lanes on every Maven release and Java version under
  # test: one call per cell, each with its own artifact_suffix, so the
  # cells share this run without reading each other's artefacts. The
  # calls above test the lanes' features on the defaults; these test
  # the toolchain. Grype and the CBOM read the SBOM and the bytecode,
  # which the toolchain does not change, so they stay off here; the
  # verify lane's SBOM runs Maven itself, so it stays on.
  compatibility-verify:
    # yamllint disable-line rule:line-length
    name: 'Compatibility Verify (Maven ${{ matrix.maven.line }}, JDK ${{ matrix.java }})'
    needs: versions
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    strategy:
      fail-fast: false
      matrix:
        maven: ${{ fromJSON(needs.versions.outputs.maven) }}
        java: ${{ fromJSON(needs.versions.outputs.java) }}
    uses: $/.github/workflows/maven-build-test.yaml
    with:
      repository: 'lfreleng-actions/test-maven-project'
      java_version: ${{ matrix.java }}
      mvn_version: ${{ matrix.maven.version }}
      artifact_suffix: '-maven-${{ matrix.maven.line }}-java-${{ matrix.java }}'
      grype_enabled: false
      cbom_enabled: false

  # The merge lane's metadata fetch and deploy are where Maven's
  # resolver meets published SNAPSHOT metadata, and Maven 3.10 moved
  # to the Resolver 2 lineage Maven 4 uses. Its SBOM step is the
  # verify lane's, which the calls above run on every cell.
  compatibility-merge:
    # yamllint disable-line rule:line-length
    name: 'Compatibility Merge (Maven ${{ matrix.maven.line }}, JDK ${{ matrix.java }})'
    needs: versions
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    strategy:
      fail-fast: false
      matrix:
        maven: ${{ fromJSON(needs.versions.outputs.maven) }}
        java: ${{ fromJSON(needs.versions.outputs.java) }}
    uses: $/.github/workflows/maven-merge.yaml
    with:
      repository: 'lfreleng-actions/test-maven-project'
      nexus_server: 'https://nexus.onap.org'
      repository_name: 'snapshots'
      dry_run: true
      java_version: ${{ matrix.java }}
      mvn_version: ${{ matrix.maven.version }}
      artifact_suffix: '-maven-${{ matrix.maven.line }}-java-${{ matrix.java }}'
      sbom_enabled: false

  # A matrix of reusable workflow calls hands its caller one cell's
  # outputs alone, so these read every cell's artefacts instead, and
  # fail on a cell that is missing as well as one that ran on the
  # wrong Maven release or JDK, as each lane recorded them. A cell
  # whose build job did not succeed in its latest attempt fails before
  # its artefacts are read: an earlier attempt's may still be there.
  compatibility-check:
    name: 'Compatibility Check (${{ matrix.lane }})'
    needs: [versions, compatibility-verify, compatibility-merge]
    if: ${{ !cancelled() && needs.versions.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read  # reads each cell's latest build job
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: 'verify'
            # yamllint disable-line rule:line-length
            pattern: '{maven-toolchain,maven-junit-reports,sbom-files-maven}-maven-*'
          - lane: 'merge'
            pattern: '{maven-merge-toolchain,maven-merge-m2repo}-maven-*'
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # For the check scripts only; the fixture is not checked out here.
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Each artefact lands in a directory of its own name. A cell that
      # uploaded nothing leaves no directory, which the check reports.
      - name: 'Download every cell'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: ${{ matrix.pattern }}
          path: cells

      # filter=latest reads each job's newest attempt, so a cell that
      # passed and then failed on a later attempt reads as failed,
      # whatever artefacts its passing attempt left behind. A page of
      # 100 jobs times out server-side (HTTP 502) on a run this size,
      # so it reads 50 a page and retries a 5xx twice before failing.
      - name: 'Read each cell build'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs"
          errors="${RUNNER_TEMP}/jobs.err"
          for delay in 5 15 0; do
            if gh api --paginate "${jobs}?filter=latest&per_page=50" \
              --jq '.jobs[] | {name, conclusion}' \
              > "${RUNNER_TEMP}/jobs.json" 2> "${errors}"; then
              exit 0
            fi
            cat "${errors}" >&2
            if [ "${delay}" -eq 0 ] \
              || ! grep -q 'HTTP 5[0-9][0-9]' "${errors}"; then
              exit 1
            fi
            echo "::warning::Jobs API server error; retrying in ${delay}s"
            sleep "${delay}"
          done

      - name: 'Assert every cell'
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          MAVEN: ${{ needs.versions.outputs.maven }}
          JAVA: ${{ needs.versions.outputs.java }}
        run: |
          bash .github/scripts/latest-attempt-check.sh "${LANE}" \
            "${RUNNER_TEMP}/jobs.json" cells "${MAVEN}" "${JAVA}"

  # The Gradle lane on every Gradle release and Java version under
  # test that Gradle supports running on: Gradle 8 stops at Java 24,
  # so the versions workflow publishes the valid pairs, not a cross
  # product. gradle_version makes gradle-build-action provision that
  # release rather than run the fixture's wrapper. The fixture compiles
  # through a Java 17 toolchain, which the runner image provides beside
  # the JDK under test. Grype and the CBOM stay off, as in the Maven
  # compatibility calls.
  compatibility-gradle:
    # yamllint disable-line rule:line-length
    name: 'Compatibility Gradle (Gradle ${{ matrix.gradle.line }}, JDK ${{ matrix.java }})'
    needs: versions
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.gradle_cells) }}
    uses: $/.github/workflows/gradle-build-test.yaml
    with:
      repository: 'lfreleng-actions/test-gradle-project'
      java_version: ${{ matrix.java }}
      gradle_version: ${{ matrix.gradle.version }}
      # yamllint disable-line rule:line-length
      artifact_suffix: '-gradle-${{ matrix.gradle.line }}-java-${{ matrix.java }}'
      grype_enabled: false
      cbom_enabled: false

  # Reads every Gradle cell's artefacts, as compatibility-check does
  # for the Maven lanes, through
  # .github/scripts/gradle-compatibility-check.sh, once the cell's
  # latest build job is known to have succeeded.
  compatibility-gradle-check:
    name: 'Compatibility Check (gradle)'
    needs: [versions, compatibility-gradle]
    if: ${{ !cancelled() && needs.versions.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read  # reads each cell's latest build job
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # For the check script only; the fixture is not checked out here.
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Each artefact lands in a directory of its own name. A cell that
      # uploaded nothing leaves no directory, which the check reports.
      - name: 'Download every cell'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          # yamllint disable-line rule:line-length
          pattern: '{gradle-toolchain,gradle-junit-reports,sbom-files-gradle}-gradle-*'
          path: cells

      # filter=latest reads each job's newest attempt, so a cell that
      # passed and then failed on a later attempt reads as failed,
      # whatever artefacts its passing attempt left behind. A page of
      # 100 jobs times out server-side (HTTP 502) on a run this size,
      # so it reads 50 a page and retries a 5xx twice before failing.
      - name: 'Read each cell build'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs"
          errors="${RUNNER_TEMP}/jobs.err"
          for delay in 5 15 0; do
            if gh api --paginate "${jobs}?filter=latest&per_page=50" \
              --jq '.jobs[] | {name, conclusion}' \
              > "${RUNNER_TEMP}/jobs.json" 2> "${errors}"; then
              exit 0
            fi
            cat "${errors}" >&2
            if [ "${delay}" -eq 0 ] \
              || ! grep -q 'HTTP 5[0-9][0-9]' "${errors}"; then
              exit 1
            fi
            echo "::warning::Jobs API server error; retrying in ${delay}s"
            sleep "${delay}"
          done

      - name: 'Assert every cell'
        shell: bash
        env:
          CELLS: ${{ needs.versions.outputs.gradle_cells }}
        run: |
          bash .github/scripts/latest-attempt-check.sh gradle \
            "${RUNNER_TEMP}/jobs.json" cells "${CELLS}"
