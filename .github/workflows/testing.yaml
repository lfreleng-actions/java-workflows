---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Exercises the reusable Maven and Gradle build/test (verify) workflows
# in this repository against downstream fixture repositories. The
# reusable workflows are referenced by LOCAL path so this always
# validates the current branch's workflows.
#
# The self-test guards every pull request. The Maven lane builds the
# dedicated lightweight fixture; the Gradle lane still builds a pinned
# upstream project because no test-gradle-project fixture exists yet
# (tracked in issue #50).
#
# The planned merge and release lanes are not self-tested here: merge
# requires a merged-commit context and release requires a signed semver
# tag-push context; neither is available or safe on a pull request.
# Instantiating repos validate those through their own cycles.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  # No workflow_dispatch: a manual run happens on the default branch,
  # which would hand this job a cache token with write access to the
  # default-branch scope while it builds and tests third-party
  # consumer repositories. Untrusted code from those repositories
  # could then poison caches that later runs restore (CWE-349).
  # Pull request runs write only to their own cache scope.
  pull_request:
    branches: ['main']

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  # Self-test of the Maven verify lane against the dedicated fixture.
  # The fixture is a three-module reactor (parent/core/app) whose only
  # dependency is JUnit, so its egress footprint is the allow-listed
  # toolchain set and block mode applies. Its Failing*Test classes stay
  # out of this build: the fixture's parent POM excludes them unless the
  # failing-tests profile is active.
  maven-build-test:
    name: 'Maven Build/Test'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: ./.github/workflows/maven-build-test.yaml
    with:
      repository: 'lfreleng-actions/test-maven-project'

  # Self-test of the Gradle verify lane. Audit egress because this
  # builds a large upstream project whose full egress footprint exceeds
  # the allow-listed toolchain set; a dedicated fixture with a known
  # footprint can switch this to block mode.
  # TODO: repoint to a test-gradle-project fixture once issue #50 lands.
  gradle-build-test:
    name: 'Gradle Build/Test'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: ./.github/workflows/gradle-build-test.yaml
    with:
      repository: 'onap/portal-ng-preferences'
      # Pin a known-good commit so the self-test is repeatable and an
      # upstream change cannot make this workflow appear broken.
      ref: '2796448b11c66b536ecf1bd0c8ae2271606e85a7'
      harden_runner_egress: 'audit'
