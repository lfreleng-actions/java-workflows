---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable Maven build/test (verify) pipeline.
#
# Reproduces the canonical Linux Foundation pipeline shape for a Maven
# project. The repository-metadata job runs in parallel as an
# informational step. After build the jobs in { } run in parallel; none
# gates another, so a PR surfaces every failure (-> denotes sequence):
#   build -> { tests | sbom -> grype | cbom }
#
# Java note: Maven binds test execution to the build lifecycle, so the
# build job runs the tests (mvn install) and gates the rest; the tests
# job renders a JUnit summary from the collected reports without
# rebuilding. Dependency vulnerability scanning is provided by the
# SBOM -> Grype leg; Nexus IQ CLM is a separate, dedicated lane.
#
# The cbom leg is informational and cannot fail the run; see the job
# for why that is pinned rather than configurable.
#
# Call this from a thin caller workflow; see examples/maven/build-test/
# for both a plain GitHub-native caller and a Gerrit-wrapped caller.
name: '[R] Maven Build/Test'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branch/tag/SHA to check out (empty = default branch)'
        required: false
        type: string
        default: ''
      checkout_submodules:
        description: >-
          Check out git submodules in every job that checks out the
          repository, on the Gerrit and plain checkout paths alike, so
          the build, SBOM and CBOM all see modules a submodule carries.
          The Gerrit path also initialises submodules the change adds.
        required: false
        type: boolean
        default: false

      # --- Project layout ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'

      # --- Java / Maven toolchain ---
      java_version:
        description: >-
          OpenJDK version for the build. Empty auto-detects from the
          project (build-metadata-action) and falls back to 21.
        required: false
        type: string
        default: ''
      mvn_version:
        description: 'Maven version to provision'
        required: false
        type: string
        default: '3.9.11'
      mvn_phases:
        description: 'Maven lifecycle phases to run for verification'
        required: false
        type: string
        default: 'clean install'
      mvn_profiles:
        description: 'Comma-delimited list of Maven profiles to activate'
        required: false
        type: string
        default: ''
      mvn_params:
        description: >-
          Extra parameters appended to the mvn command. Must not set
          altDeploymentRepository, altReleaseDeploymentRepository or
          altSnapshotDeploymentRepository: any deploy targets the
          workspace m2repo, and maven-build-action refuses one naming
          anywhere else (from v0.5.1) and warns on one naming the
          m2repo (from v0.5.3). Remove them from shared build
          arguments.
        required: false
        type: string
        default: ''
      mvn_opts:
        description: >-
          Maven options for the build (maven-build-action mvn-opts),
          placed on the mvn command line ahead of mvn_params, for
          example '-Dmaven.repo.local=/tmp/r -Dkaraf.keep.unpack'.
          Non-empty replaces the action's default options, which set
          maven.repo.local and the Pax URL local repository to /tmp/r
          and quiet transfer logging; empty keeps them. The SBOM step
          receives the value too. Must not set altDeploymentRepository,
          altReleaseDeploymentRepository or
          altSnapshotDeploymentRepository, for the reasons given for
          mvn_params.
        required: false
        type: string
        default: ''
      mvn_pom_file:
        description: >-
          POM to build, relative to path_prefix (maven-build-action
          mvn-pom-file). Empty means pom.xml. Java detection reads the
          selected POM's directory; a POM not named pom.xml requires
          java_version. The SBOM step resolves path_prefix/pom.xml, so
          the build job fails when this names another POM and
          sbom_enabled is set, rather than describe a different
          project. For a pom.xml in a subdirectory, set path_prefix to
          that directory instead.
        required: false
        type: string
        default: ''
      env_vars:
        description: >-
          JSON object of named variables exported to the environment of
          the build job (maven-build-action env-vars), where the SBOM
          step inherits them, for example '{"MY_FLAG": "1"}'.
          Names are upper-cased. A name whose variable already holds a
          non-empty value is skipped; an empty one is overwritten. With
          sbom_enabled set, the build job fails on a name that is not
          an ASCII identifier, and on one either Maven step sets
          itself, such as MAVEN_ARGS.
          Name each variable rather than
          passing toJSON(vars), which exports every repository
          variable. Inputs are not masked, so never pass secrets.
        required: false
        type: string
        default: '{}'
      run_jacoco:
        description: 'Run JaCoCo coverage during the build'
        required: false
        type: boolean
        default: true

      # --- Tests ---
      test_permit_fail:
        description: >-
          Permit test failures without failing the workflow. Adds
          -Dmaven.test.failure.ignore=true so the build completes, then
          the test summary reports results without failing.
        required: false
        type: boolean
        default: false

      # --- SBOM ---
      sbom_enabled:
        description: >-
          Generate an SBOM (set false to skip). The Grype scan reads
          the SBOM, so skipping generation leaves it nothing to scan.
          To keep the SBOM but drop the scan, use grype_enabled.
        required: false
        type: boolean
        default: true

      # --- Grype scan ---
      grype_enabled:
        description: >-
          Run the Grype vulnerability scan over the generated SBOM (set
          false to skip). Decoupling is one-way: disabling the scan
          keeps the SBOM, but disabling the SBOM also stops the scan,
          which has nothing to read.
        required: false
        type: boolean
        default: true
      grype_fail_on:
        description: 'Minimum severity that fails the Grype scan'
        required: false
        type: string
        default: 'medium'
      grype_permit_fail:
        description: >-
          Permit Grype findings without failing the job. When false, falls
          back to the NO_BLOCK_AUDIT_FAIL repository variable at runtime.
        required: false
        type: boolean
        default: false

      # --- CBOM (informational) ---
      # A CBOM records which cryptographic algorithms, key sizes, modes
      # and protocols the code actually calls, which an SBOM cannot
      # express, and it feeds post-quantum readiness assessments.
      #
      # There is deliberately no cbom_permit_fail alongside these: the
      # leg is advisory by contract, so its steps pin the action's
      # fail_on_error to false and carry continue-on-error. Callers
      # that do not want the report turn it off instead.
      cbom_enabled:
        description: >-
          Generate a CycloneDX Cryptography Bill of Materials (CBOM).
          Informational: it never fails the workflow run. Set false
          to drop it.
        required: false
        type: boolean
        default: true
      cbom_languages:
        description: >-
          Comma-separated languages to scan: java, python, go, csharp.
          Empty auto-detects from the checked-out tree, which is right
          for a polyglot repository as well as a plain Maven one.
        required: false
        type: string
        default: ''
      cbom_exclude:
        description: >-
          Comma-separated Java regex patterns excluded from scanning.
          Empty keeps the scanner default, which skips test sources.
        required: false
        type: string
        default: ''
      cbom_module_cboms:
        description: >-
          Emit a per-module CBOM alongside the consolidated one. Worth
          keeping for a multi-module reactor, where it attributes each
          finding to the module that made it.
        required: false
        type: boolean
        default: true
      cbom_empty_cboms:
        description: >-
          Write CBOM files even when the scan finds no cryptographic
          assets. False uploads nothing for a project that calls none,
          at the cost of losing the evidence that a scan ran.
        required: false
        type: boolean
        default: true

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      build_permit_egress_traffic:
        description: >
          Run harden-runner in audit mode for the build job only,
          permitting unrestricted egress. Use when the build fetches
          dependencies from CDNs that are impractical to enumerate in
          the allow-list. The SBOM and CBOM run inside the build job,
          so they share its policy. Other jobs stay governed by
          harden_runner_egress; left unset, the build job follows it
          too.
        required: false
        type: boolean
        default: false
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@ac32415b91e0b6db1166bc451024c472cdbcbd3d'  # v0.16.8

      # --- Timeouts (minutes) ---
      # The test summary, SBOM and CBOM run as steps inside the build
      # job, each bounded by its own step timeout below, and all of them
      # within build_timeout_minutes, which bounds the whole job. Size
      # that one for the build plus these steps. Grype stays a separate
      # job with its own timeout. The validation and metadata jobs do
      # fixed work and are not configurable. Defaults suit a large
      # multi-module reactor on a busy shared runner; they bound a hung
      # job or step, so erring high costs nothing.
      build_timeout_minutes:
        description: >-
          Timeout for the build job, including the test summary, SBOM
          and CBOM steps that run within it.
        required: false
        type: number
        default: 45
      tests_timeout_minutes:
        description: 'Timeout for the test summary step'
        required: false
        type: number
        default: 30
      sbom_timeout_minutes:
        description: 'Timeout for the SBOM generation step'
        required: false
        type: number
        default: 30
      grype_timeout_minutes:
        description: 'Timeout for the Grype scan job'
        required: false
        type: number
        default: 30
      cbom_timeout_minutes:
        description: >-
          Timeout for the CBOM generation step. Covers a container image
          pull as well as the scan itself.
        required: false
        type: number
        default: 30

      # --- Build artefact publication ---
      # Off by default. The build's packaged output is large and most
      # verify lanes never look at it again, so uploading unconditionally
      # would impose storage on every consumer to serve a minority. Turn
      # it on where a later job, or a human, needs the built output:
      # publish/stage lanes, container builds, CSIT, or downloading a jar
      # from a failed run to reproduce a problem locally.
      upload_build_artifacts:
        description: >-
          Upload the packaged build output as a workflow artefact.
          Prefers the m2repo when a deploy phase produced one, since
          that is the layout publish and stage lanes consume; otherwise
          takes the reactor's packaged output.
        required: false
        type: boolean
        default: false
      build_artifact_retention_days:
        description: >-
          Retention for the build artefact. Shorter than the SBOM's 45
          days: build output is reproducible from the commit, so it is
          a convenience rather than a record.
        required: false
        type: number
        default: 7
      # A run shares one artifact namespace across every lane it calls.
      # upload-artifact refuses a name already used within one job, but
      # uploads from separate jobs coexist under one name, and
      # download-artifact then takes the newest. Two calls of this
      # workflow in one run, as a matrix makes, are separate jobs, so
      # each would read whichever call's reports and SBOM landed last.
      # Each call sets its own suffix; a single call leaves it empty.
      artifact_suffix:
        description: >-
          Appended to the name of every artefact this workflow names
          itself, uploaded or read back, so several calls can share
          one run (a matrix of Java or Maven versions, say).
          repository-metadata-action names its own upload uniquely.
          Empty, or a '-' followed by letters, digits, '.', '_' or
          '-'.
        required: false
        type: string
        default: ''

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the change under test'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

    secrets:
      # settings.xml commonly carries server credentials (passwords,
      # tokens), so it is accepted only as a secret -- never a plain
      # input -- to keep the value masked in logs and the run UI. The
      # content is typically synthesised by maven-xml-settings-action.
      # Omit it for builds that need no global settings.
      maven_global_settings:
        description: 'Maven global settings.xml content (masked secret)'
        required: false

permissions: {}

jobs:
  gerrit-validate:
    name: 'Validate Gerrit Inputs'
    # Fails fast with a clear message when gerrit_refspec is set without
    # the project/branch the Gerrit checkout path also requires. The
    # build-chain root job depends on this, so invalid Gerrit inputs stop
    # the pipeline early and cleanly. This job always runs (only the
    # validation step is conditional), so gating dependents on it does
    # not trip GitHub's "skipped need skips dependents" behaviour.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      # Every artefact name ends with the suffix, and upload-artifact
      # refuses some characters only at upload time, after the build.
      - name: 'Validate artifact_suffix'
        if: inputs.artifact_suffix != ''
        shell: bash
        env:
          ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix }}
        run: |
          set -euo pipefail
          if [[ ! "${ARTIFACT_SUFFIX}" =~ ^-[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "::error::artifact_suffix must be a '-' followed by up" \
              "to 64 letters, digits, '.', '_' or '-'."
            exit 1
          fi
      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

  repository-metadata:
    name: 'Repository Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    timeout-minutes: 10
    steps:
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever
      # a step-level 'if:' says. Both would engage the agent, the
      # first would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
          submodules: ${{ inputs.checkout_submodules }}
      # checkout-gerrit-change-action v1.1.1 and later initialise the
      # submodules a change adds or moves; v1.1.0 skipped them. Kept as
      # an idempotent guard that wiring-check.sh enforces, so a pin
      # regression cannot reintroduce the gap; see docs/BRIEF.md.
      - name: 'Initialise Gerrit change submodules'
        if: inputs.gerrit_refspec != '' && inputs.checkout_submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync
          git submodule update --init
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
          submodules: ${{ inputs.checkout_submodules }}

      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@b2078d32ca207a0e110b2157a95271a35688c8e7  # v0.3.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'

  build:
    name: 'Build'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.build.outputs.coverage }}
      branch_coverage: ${{ steps.build.outputs.branch_coverage }}
      # Read by the Grype job, which runs whenever an SBOM was uploaded,
      # including after a test failure.
      sbom_uploaded: ${{ steps.upload-sbom.outcome == 'success' }}
      # Surfaced so a caller's downstream job can locate the
      # publish-ready repository layout without re-deriving the path.
      m2repo_exists: ${{ steps.build.outputs.m2repo_exists }}
      m2repo_path: ${{ steps.build.outputs.m2repo_path }}
      artifact_count: ${{ steps.build.outputs.artifact_count }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    steps:
      # The build job can opt into audit egress independently of the
      # other jobs via build_permit_egress_traffic, for dependency
      # fetches from CDNs impractical to enumerate in the allow-list.
      # Left unset it follows harden_runner_egress like every other job.
      #
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever
      # a step-level 'if:' says. Both would engage the agent, the
      # first would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        env:
          # The CBOM scanner is a container, so its image pull needs the
          # registry endpoints. The organisation allow-list already
          # carries both; naming them here keeps the CBOM working when a
          # caller points harden_runner_allowlist at a narrower list.
          # yamllint disable-line rule:line-length
          CBOM_ENDPOINTS: ${{ inputs.cbom_enabled && 'ghcr.io:443 pkg-containers.githubusercontent.com:443' || '' }}
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ (inputs.build_permit_egress_traffic || inputs.harden_runner_egress == 'audit') && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
            ${{ env.CBOM_ENDPOINTS }}

      # sbom-action resolves path_prefix/pom.xml and rejects -f/--file,
      # since an alternate POM would escape the directory it validated.
      # A build of any other POM would leave the SBOM step describing a
      # different project from the one built, under the same name, so
      # fail rather than upload it. The Gradle lane fails the same way
      # on its project-selection options. Runs first: it needs no
      # checkout, so a mismatch costs nothing. Skipped with the SBOM,
      # which is how a caller builds another POM.
      - name: 'Require the POM the SBOM resolves'
        id: pom-guard
        if: inputs.sbom_enabled
        shell: bash
        env:
          MVN_POM_FILE: ${{ inputs.mvn_pom_file }}
        run: |
          set -euo pipefail
          pom="${MVN_POM_FILE}"
          while [ "${pom#./}" != "${pom}" ]; do
            pom="${pom#./}"
          done
          case "${pom}" in
            '' | 'pom.xml') exit 0 ;;
          esac
          # Escape the workflow-command metacharacters, % first, so the
          # value cannot end the annotation and start another command.
          shown="${MVN_POM_FILE//'%'/'%25'}"
          shown="${shown//$'\r'/'%0D'}"
          shown="${shown//$'\n'/'%0A'}"
          echo "::error::mvn_pom_file selects '${shown}', but the" \
            "SBOM step resolves path_prefix/pom.xml, so the SBOM would" \
            "not describe the build. Set path_prefix to the directory" \
            "holding the POM, or set sbom_enabled: false."
          exit 1

      # env_vars reaches resolution: a profile can activate on an
      # env.* property, a POM can read one into a version, and
      # MAVEN_OPTS carries system properties into Maven. The build
      # step exports it to GITHUB_ENV, so the SBOM step inherits it. A
      # name that either Maven step sets itself would hold one value
      # there and the exported value in the other, since a step's own
      # env: wins over GITHUB_ENV: sbom-action's generate step forces
      # MAVEN_ARGS empty, for one. Fail on those rather than resolve
      # another graph. The lists come from sbom-action v0.2.0 and
      # maven-build-action v0.5.3; recheck them when either pin moves.
      - name: 'Require an environment the SBOM can reproduce'
        id: env-guard
        if: inputs.sbom_enabled
        shell: bash
        env:
          ENV_VARS: ${{ inputs.env_vars }}
        run: |
          set -euo pipefail
          if [ -z "${ENV_VARS}" ]; then
            exit 0
          fi
          if ! jq -e 'type == "object"' <<< "${ENV_VARS}" > /dev/null; then
            echo '::error::env_vars must be a JSON object of named' \
              'variables.'
            exit 1
          fi
          # vars-to-env-action upper-cases each name with full Unicode
          # case mapping, which maps some non-ASCII letters onto ASCII
          # ones: 'maven_arg\u017f' exports as MAVEN_ARGS. jq's
          # ascii_upcase leaves them, so such a name would pass the
          # comparison below. Reject every name that is not an ASCII
          # identifier, since both upper-case those alike. The count
          # keeps the names themselves out of the annotation.
          invalid="$(jq -r '[keys[]
            | select(test("\\A[A-Za-z_][A-Za-z0-9_]*\\z") | not)]
            | length' <<< "${ENV_VARS}")"
          if [ "${invalid}" != '0' ]; then
            echo "::error::env_vars holds ${invalid} name(s) that are" \
              'not ASCII identifiers ([A-Za-z_][A-Za-z0-9_]*).'
            exit 1
          fi
          reserved=' MAVEN_ARGS BACKEND DEPENDENCY_MANAGER SKIPPED'
          reserved+=' SKIP_REASON SYFT_CMD PROJECT_DIR SBOM_FORMAT'
          reserved+=' SPEC_VERSION FILENAME_PREFIX OUTPUT_DIRECTORY'
          reserved+=' INCLUDE_DEV FAIL_ON_ERROR MAVEN_PLUGIN_VERSION'
          reserved+=' INPUT_MAVEN_ARGS GRADLE_PLUGIN_VERSION'
          reserved+=' GRADLE_VERSION GRADLE_MINIMUM JAVA_VERSION'
          reserved+=' INPUT_GRADLE_ARGS'
          reserved+=' SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES'
          reserved+=' PATH_PREFIX GLOBAL_SETTINGS MVN_PHASES MVN_POM_FILE'
          reserved+=' MVN_PROFILES MVN_OPTS MVN_PARAMS JACOCO_ARGS '
          status=0
          while IFS= read -r name; do
            case "${reserved}" in
              *" ${name} "*)
                echo "::error::env_vars sets ${name}, which the build or" \
                  "SBOM step sets itself, so the two would resolve" \
                  "with different values."
                status=1 ;;
            esac
          done < <(jq -r 'keys[] | ascii_upcase' <<< "${ENV_VARS}")
          exit "${status}"

      # Read by the CBOM budget step below.
      - name: 'Record job start'
        id: job-start
        shell: bash
        run: echo "epoch=$(date +%s)" >> "${GITHUB_OUTPUT}"

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@35e98c8043ec411611e464e296bcfb441a5c5093  # v1.1.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
          submodules: ${{ inputs.checkout_submodules }}
      # checkout-gerrit-change-action v1.1.1 and later initialise the
      # submodules a change adds or moves; v1.1.0 skipped them. Kept as
      # an idempotent guard that wiring-check.sh enforces, so a pin
      # regression cannot reintroduce the gap; see docs/BRIEF.md.
      - name: 'Initialise Gerrit change submodules'
        if: inputs.gerrit_refspec != '' && inputs.checkout_submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync
          git submodule update --init
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
          submodules: ${{ inputs.checkout_submodules }}

      # Detect Java/Maven project metadata: Java version (including
      # maven.compiler.release plus parent/reactor resolution), module
      # layout, version.properties and any releases/*.yaml. Lets the
      # build pick the Java version when the caller does not pin one.
      # The action takes no github_summary input; one was passed here
      # until it was noticed in the run annotations, ignored throughout.
      #
      # It reads the pom.xml in the directory it is given, so point it
      # at the directory of the POM the build runs. It cannot read a
      # POM under any other name, and would then report on whichever
      # pom.xml sits beside it, so that case requires java_version.
      - name: 'Locate the POM for metadata'
        id: pom
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          MVN_POM_FILE: ${{ inputs.mvn_pom_file }}
          JAVA_VERSION: ${{ inputs.java_version }}
        run: |
          set -euo pipefail
          case "${PATH_PREFIX}${MVN_POM_FILE}" in
            *$'\n'* | *$'\r'*)
              echo '::error::path_prefix and mvn_pom_file may not hold' \
                'a line break.'
              exit 1 ;;
          esac
          pom="${MVN_POM_FILE:-pom.xml}"
          dir="$(dirname -- "${pom}")"
          metadata_path="${PATH_PREFIX}"
          if [ "$(basename -- "${pom}")" != 'pom.xml' ]; then
            if [ -z "${JAVA_VERSION}" ]; then
              echo "::error::mvn_pom_file names a POM build-metadata-action" \
                "cannot read, so the Java version cannot come from it." \
                "Set java_version."
              exit 1
            fi
          elif [ "${dir}" != '.' ]; then
            metadata_path="${PATH_PREFIX}/${dir}"
          fi
          printf 'metadata_path=%s\n' "${metadata_path}" >> "${GITHUB_OUTPUT}"

      - name: 'Detect build metadata'
        id: metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/build-metadata-action@a42f21be0f09b3f463da8d349a6ac5d19ac67d3b  # v0.9.0
        with:
          path_prefix: ${{ steps.pom.outputs.metadata_path }}

      - name: 'Build with Maven'
        id: build
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/maven-build-action@0f09f8024307dbdba2f89286479e0e870f7065ff  # v0.5.3
        with:
          path_prefix: ${{ inputs.path_prefix }}
          # Caller override wins, else the detected version, else 21.
          # yamllint disable-line rule:line-length
          java-version: ${{ inputs.java_version != '' && inputs.java_version || steps.metadata.outputs.java_version || '21' }}
          mvn-version: ${{ inputs.mvn_version }}
          mvn-phases: ${{ inputs.mvn_phases }}
          mvn-profiles: ${{ inputs.mvn_profiles }}
          # When test failures are permitted, let Maven complete the build
          # (so artefacts and reports are produced) and defer the pass/fail
          # verdict to the test summary's report gate.
          # yamllint disable-line rule:line-length
          mvn-params: ${{ inputs.test_permit_fail && format('{0} -Dmaven.test.failure.ignore=true', inputs.mvn_params) || inputs.mvn_params }}
          # A composite action applies an input default only when the
          # input is absent, never when it arrives empty, so each empty
          # value below falls back to the action's own default. The
          # mvn-opts fallback restates maven-build-action v0.5.3's
          # default verbatim: it keeps the /tmp/r local repository
          # every existing caller builds with. Recheck it when the pin
          # above moves.
          # yamllint disable-line rule:line-length
          mvn-opts: ${{ inputs.mvn_opts != '' && inputs.mvn_opts || '-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn -Dmaven.repo.local=/tmp/r -Dorg.ops4j.pax.url.mvn.localRepository=/tmp/r' }}
          # yamllint disable-line rule:line-length
          mvn-pom-file: ${{ inputs.mvn_pom_file != '' && inputs.mvn_pom_file || 'pom.xml' }}
          # vars-to-env-action requires a JSON document, and '{}' is
          # the empty one.
          env-vars: ${{ inputs.env_vars != '' && inputs.env_vars || '{}' }}
          global-settings: ${{ secrets.maven_global_settings }}
          run-jacoco: ${{ inputs.run_jacoco }}
          # The action names its badge artefact after the job, the same
          # in every call of this workflow, so carry the suffix here too.
          artifact-name: maven-build-build${{ inputs.artifact_suffix }}

      # A caller running several calls in one run reads the JDK from
      # the reports, but nothing the build uploads records which Maven
      # ran it. Record both as Maven reports them, run from outside the
      # project so its .mvn configuration does not apply. A single call,
      # with no suffix, uploads nothing more.
      - name: 'Record the toolchain'
        id: toolchain
        if: ${{ !cancelled() && inputs.artifact_suffix != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/toolchain"
          cd "${RUNNER_TEMP}"
          mvn --version | tee "${RUNNER_TEMP}/toolchain/toolchain.txt"
      - name: 'Upload the toolchain record'
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: maven-toolchain${{ inputs.artifact_suffix }}
          path: ${{ runner.temp }}/toolchain/toolchain.txt
          retention-days: 7
          if-no-files-found: error

      - name: 'Collect JUnit reports'
        id: reports
        if: always()
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          # Copy Surefire/Failsafe XML out of the reactor, for the
          # summary below and for the uploaded artefact.
          set -euo pipefail
          dest="junit-reports"
          found=0
          while IFS= read -r -d '' f; do
            rel="${f#"${PATH_PREFIX}/"}"
            mkdir -p "${dest}/$(dirname "${rel}")"
            cp "${f}" "${dest}/${rel}"
            found=1
          done < <(find "${PATH_PREFIX}" -type f \
            -path '*/target/*-reports/*.xml' -print0)
          echo "found=${found}" >> "$GITHUB_OUTPUT"
          echo "Collected JUnit reports (found=${found})"

      - name: 'Upload JUnit reports'
        if: ${{ always() && steps.reports.outputs.found == '1' }}
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: maven-junit-reports${{ inputs.artifact_suffix }}
          path: junit-reports
          if-no-files-found: warn

      # Maven ran the tests during the build step, so a test failure has
      # already failed it. This only renders the collected XML, and so
      # runs whatever the build's outcome.
      - name: 'Summarise test results'
        if: ${{ !cancelled() && steps.reports.outputs.found == '1' }}
        timeout-minutes: ${{ inputs.tests_timeout_minutes }}
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/junit-test-report-action@cbc41af8f2e0cf6363d5b04df00025f938bf9a5e  # v0.0.2
        with:
          report-paths: 'junit-reports/**/*.xml'
          fail-on-failure: ${{ !inputs.test_permit_fail }}
          # Uploaded above as maven-junit-reports; disable the action's
          # own upload to avoid a duplicate artefact.
          artifact-upload: 'false'

      - name: 'No test reports'
        if: ${{ !cancelled() && steps.reports.outputs.found != '1' }}
        shell: bash
        run: |
          # The build produced no Surefire/Failsafe XML (a project with
          # no tests, or a build that stopped before the test phase).
          echo 'No JUnit reports were produced by the build'

      # Two shapes can come out of a Maven build and they are not
      # interchangeable. A deploy phase writes a repository layout to
      # m2repo (groupId/artifactId/version/...), which is what Nexus
      # staging and publish consume. Any other phase leaves packaged
      # output scattered through the reactor's target/ directories.
      # Prefer the former when it exists and say which was taken, so a
      # consumer downloading the artefact knows what it has.
      - name: 'Collect build artefacts'
        id: build-artifacts
        if: ${{ always() && inputs.upload_build_artifacts }}
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          M2REPO_EXISTS: ${{ steps.build.outputs.m2repo_exists }}
          M2REPO_PATH: ${{ steps.build.outputs.m2repo_path }}
        run: |
          # Stage the build output under a single directory for upload.
          set -euo pipefail
          dest="build-artifacts"
          shape="none"
          count=0

          # Take the location from the build action rather than
          # re-deriving it, so the layout stays the action's business.
          if [ "${M2REPO_EXISTS}" = "true" ] && [ -n "${M2REPO_PATH}" ] \
             && [ -d "${M2REPO_PATH}" ]; then
            shape="m2repo"
            mkdir -p "${dest}"
            cp -R "${M2REPO_PATH}" "${dest}/m2repo"
            count=$(find "${dest}/m2repo" -type f \
              \( -name '*.jar' -o -name '*.war' -o -name '*.ear' \
                 -o -name '*.pom' \) | wc -l | tr -d ' ')
          else
            # No deploy phase ran. Take the reactor's packaged output:
            # files sitting directly in a module's target/ directory,
            # not the compiled classes or unpacked dependencies below it.
            shape="reactor"
            while IFS= read -r -d '' dir; do
              for f in "${dir}"/*.jar "${dir}"/*.war "${dir}"/*.ear; do
                [ -f "${f}" ] || continue
                rel="${f#"${PATH_PREFIX}/"}"
                mkdir -p "${dest}/$(dirname "${rel}")"
                cp "${f}" "${dest}/${rel}"
                count=$((count + 1))
              done
            done < <(find "${PATH_PREFIX}" -type d -name target -print0)
          fi

          if [ "${count}" -eq 0 ]; then
            shape="none"
          fi

          {
            echo "shape=${shape}"
            echo "count=${count}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build artefacts"
            echo ""
            echo "| Property | Value |"
            echo "| -------- | ----- |"
            echo "| Layout | ${shape} |"
            echo "| Files | ${count} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Collected ${count} file(s) as '${shape}' layout"

      - name: 'Upload build artefacts'
        # yamllint disable-line rule:line-length
        if: ${{ always() && inputs.upload_build_artifacts && steps.build-artifacts.outputs.count != '0' }}
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # yamllint disable-line rule:line-length
          name: maven-build-artifacts-${{ steps.build-artifacts.outputs.shape }}${{ inputs.artifact_suffix }}
          path: build-artifacts
          retention-days: ${{ inputs.build_artifact_retention_days }}
          if-no-files-found: error

      # --- SBOM ---
      # Generated in the job that built the project, so it describes the
      # dependency graph this build has just resolved rather than
      # resolving it a second time. The cyclonedx backend resolves
      # without compiling, so these steps still produce an SBOM after a
      # test or compile failure; only a resolution failure leaves
      # nothing to describe.

      # The same global settings the build used, since they can define
      # the mirrors and repositories resolution reaches. maven-build-action
      # removes its own copy when it finishes, so this writes another,
      # to a private file under RUNNER_TEMP only when the secret is set,
      # and removes it below whatever happens. The explicit condition
      # drops the implicit success() gate, so require both SBOM guards
      # by name: the steps below chain on this one, and a POM or
      # environment the guards rejected would describe another graph.
      - name: 'Install Maven global settings'
        id: settings
        # yamllint disable-line rule:line-length
        if: ${{ !cancelled() && inputs.sbom_enabled && steps.pom-guard.outcome == 'success' && steps.env-guard.outcome == 'success' }}
        shell: bash
        env:
          GLOBAL_SETTINGS: ${{ secrets.maven_global_settings }}
        run: |
          set -euo pipefail
          if [ -z "${GLOBAL_SETTINGS}" ]; then
            echo 'arg=' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          umask 077
          file="$(mktemp "${RUNNER_TEMP}/sbom-global-settings.XXXXXXXXXX")"
          printf '%s' "${GLOBAL_SETTINGS}" > "${file}"
          echo "arg=--global-settings ${file}" >> "${GITHUB_OUTPUT}"
          echo "path=${file}" >> "${GITHUB_OUTPUT}"

      # Generate the CycloneDX SBOM from Maven's resolved dependency
      # graph (cyclonedx-maven-plugin makeAggregateBom), not from the
      # pom.xml text. A pom.xml is an input to resolution, so a static
      # scan misses every transitive dependency and reports BOM-managed
      # versions as UNKNOWN, which Grype cannot match (issue #47). The
      # defaults emit sbom-cyclonedx.json and sbom-cyclonedx.xml at the
      # workspace root; the JSON document is the Grype job's scan
      # contract. The action writes its own summary, including the
      # component count.
      #
      # Resolution reuses the local repository the build step populated.
      # A non-empty mvn_opts reaches the build verbatim, so it is
      # forwarded as is and names that repository itself, or leaves it
      # at ~/.m2 in both places. An empty one gives the build the
      # fallback above, which places it at /tmp/r, so the same
      # maven.repo.local stands in for it here; without it Maven would
      # use ~/.m2 and download the graph again. Should that fallback
      # move, the SBOM stays correct and only loses the reuse.
      #
      # untrusted_checkout is 'false' deliberately. The backend runs
      # Maven, and Maven loads project extensions, so a checkout is
      # executable input. Its 'auto' mode classifies fork pull requests
      # as untrusted and skips, losing the SBOM. That guard buys nothing
      # here: the build step above has already run Maven, the compiler
      # and the tests over this same checkout, with the same read-only
      # token and global settings.
      - name: 'Generate SBOM'
        id: sbom
        # The explicit condition drops the implicit success() gate, so
        # require the settings step by name: without it, resolution
        # would bypass the mirrors and repositories the build used.
        # yamllint disable-line rule:line-length
        if: ${{ !cancelled() && inputs.sbom_enabled && steps.settings.outcome == 'success' }}
        timeout-minutes: ${{ inputs.sbom_timeout_minutes }}
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/sbom-action@58b6094cf67d072d6eb772590c43ee52c8c69bb6  # v0.2.0
        with:
          backend: 'cyclonedx'
          # Named rather than left to 'auto', so the lane states the
          # build tool its caller chose instead of inferring it.
          dependency_manager: 'maven'
          path_prefix: ${{ inputs.path_prefix }}
          # yamllint disable-line rule:line-length
          java_version: ${{ inputs.java_version != '' && inputs.java_version || steps.metadata.outputs.java_version || '21' }}
          # Resolve the graph the build resolved: the same profiles,
          # global settings, options and parameters, in the build's
          # order, since each can add modules, repositories or
          # dependency versions. maven-build-action places mvn-opts on
          # the mvn command line, not in MAVEN_OPTS, so its -D and -P
          # reach resolution there too. maven-build-action also expands
          # workspace variables such as ${GITHUB_WORKSPACE} in both
          # strings; this path passes them to Maven unexpanded.
          # env_vars needs no step here: the build's export writes
          # GITHUB_ENV, so it holds for the rest of this job.
          # yamllint disable-line rule:line-length
          maven_args: ${{ format('{0} {1} {2} {3}', inputs.mvn_profiles != '' && format('-P{0}', inputs.mvn_profiles) || '', steps.settings.outputs.arg, inputs.mvn_opts != '' && inputs.mvn_opts || '-Dmaven.repo.local=/tmp/r', inputs.mvn_params) }}
          untrusted_checkout: 'false'

      - name: 'Remove Maven global settings'
        if: ${{ always() && steps.settings.outputs.path != '' }}
        shell: bash
        env:
          SETTINGS_FILE: ${{ steps.settings.outputs.path }}
        run: rm -f -- "${SETTINGS_FILE}"

      - name: 'Upload SBOM artifacts'
        id: upload-sbom
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' }}
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Lane-specific: a caller invoking both the Maven and Gradle
          # workflows shares one run, and so one artifact namespace.
          # Duplicate names are permitted and both uploads persist as
          # separate artifacts, but download-artifact resolves a name
          # to the newest match, so a shared 'sbom-files' had both
          # Grype jobs scan whichever lane happened to upload last.
          name: sbom-files-maven${{ inputs.artifact_suffix }}
          # Glob matches whichever SBOM formats the generator produced
          path: sbom-cyclonedx.*
          retention-days: 45
          # The Grype job reads this artifact, so a missing or misnamed
          # SBOM must surface here rather than there.
          if-no-files-found: error

      # --- CBOM (informational) ---
      # Scans the tree this job has just built, so the scanner resolves
      # symbols against the compiled classes under each module's
      # target/ rather than bare source, which cbom-action documents as
      # resolving fewer. Dependency jars sit in /tmp/r, outside the
      # directory the action scans, so they stay out of its reach.
      #
      # It cannot fail the run. The action's fail_on_error is pinned
      # false, and continue-on-error on these steps absorbs anything the
      # action rejects outright and the step timeout, because the value
      # of a CBOM is the report it produces, never a verdict it
      # withholds. Callers who do not want it set cbom_enabled false.
      #
      # continue-on-error cannot absorb the JOB timeout, which would end
      # the whole job as a failure if it landed during the scan. The
      # budget step therefore clamps the scan's timeout to what remains
      # of build_timeout_minutes, less a margin for the setup and pre
      # phases before the job-start stamp, the upload and the post
      # phases, and skips the scan with a warning when nothing remains.
      #
      # Known limitation: the CBOM's metadata block (gitUrl, revision,
      # commit) comes from the run's own GITHUB_* context, which names
      # the CALLING repository and commit. Where 'repository' or 'ref'
      # selects a different tree, and on a Gerrit-sourced run where the
      # checked-out change is not the mirror commit, that metadata
      # describes the caller rather than the source scanned. The
      # cryptographic findings are unaffected. Fixing it needs explicit
      # metadata inputs on cbom-action, which has none today.
      #
      # Its 'image' input is not surfaced as a workflow input. The
      # default is a digest that travels with the action version pinned
      # below, and a workflow input defaulting to empty cannot fall
      # through to it: a composite action applies a default only when
      # the input is absent, never when it arrives empty. Bump the
      # action to move the scanner.
      - name: 'Budget the CBOM step'
        id: cbom-budget
        if: ${{ !cancelled() && inputs.cbom_enabled }}
        continue-on-error: true
        shell: bash
        env:
          STARTED: ${{ steps.job-start.outputs.epoch }}
          JOB_LIMIT: ${{ inputs.build_timeout_minutes }}
          STEP_LIMIT: ${{ inputs.cbom_timeout_minutes }}
          MARGIN: 5
        run: |
          set -euo pipefail
          # Whole minutes, rounding elapsed time up and limits down.
          elapsed=$(( ($(date +%s) - STARTED + 59) / 60 ))
          remaining=$(( ${JOB_LIMIT%%.*} - elapsed - MARGIN ))
          minutes=${STEP_LIMIT%%.*}
          if [ "${remaining}" -lt "${minutes}" ]; then
            minutes=${remaining}
          fi
          if [ "${minutes}" -lt 1 ]; then
            echo "::warning::CBOM skipped: build_timeout_minutes leaves" \
              "no time for it after ${elapsed} minute(s)."
            echo "- CBOM skipped: no time left within" \
              "\`build_timeout_minutes\`." >> "${GITHUB_STEP_SUMMARY}"
            minutes=0
          fi
          echo "minutes=${minutes}" >> "${GITHUB_OUTPUT}"

      - name: 'Generate CBOM'
        id: cbom
        # yamllint disable-line rule:line-length
        if: ${{ !cancelled() && inputs.cbom_enabled && steps.cbom-budget.outputs.minutes != '' && steps.cbom-budget.outputs.minutes != '0' }}
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.cbom-budget.outputs.minutes) }}
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/cbom-action@06a25686fe4ebcbb8c9f28d6948cdca7d65ed852  # v0.0.1
        with:
          path_prefix: ${{ inputs.path_prefix }}
          # Reports go to runner temp, never the workspace. The action
          # defaults output_directory to '.', and its file_count and
          # cbom_pattern outputs cover every cbom*.json sitting in that
          # directory rather than only the files this scan wrote. A
          # project that tracks its own cbom.json at the repository
          # root would otherwise have it overwritten, counted as scan
          # output and uploaded as though this scan produced it.
          output_directory: ${{ runner.temp }}/cbom
          languages: ${{ inputs.cbom_languages }}
          exclude: ${{ inputs.cbom_exclude }}
          module_cboms: ${{ inputs.cbom_module_cboms }}
          empty_cboms: ${{ inputs.cbom_empty_cboms }}
          # Pinned rather than exposed: continue-on-error already
          # absorbs a failure, so an input offering to flip this would
          # promise a gate the step cannot deliver.
          fail_on_error: 'false'

      - name: 'Upload CBOM artifacts'
        # yamllint disable-line rule:line-length
        if: ${{ !cancelled() && steps.cbom.outcome == 'success' && steps.cbom.outputs.file_count != '0' }}
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Lane-specific for the same reason as the SBOM upload.
          name: cbom-files-maven${{ inputs.artifact_suffix }}
          # Absolute glob under runner temp, covering the consolidated
          # CBOM and, when cbom_module_cboms is on, the per-module files
          # beside it. upload-artifact roots the archive at the common
          # ancestor, so the files land at the artefact root.
          path: ${{ steps.cbom.outputs.cbom_pattern }}
          retention-days: 45
          # The condition above already skips an empty scan, so a miss
          # here is a surprise worth logging but not worth failing an
          # informational step over.
          if-no-files-found: warn

  grype:
    name: 'Grype Audit SBOM'
    runs-on: ubuntu-latest
    needs: 'build'
    # Runs whenever the build job uploaded an SBOM, including after a
    # test failure: the audit reads the document, not the build.
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.outputs.sbom_uploaded == 'true' && inputs.grype_enabled }}
    timeout-minutes: ${{ inputs.grype_timeout_minutes }}
    permissions:
      contents: read
    steps:
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever
      # a step-level 'if:' says. Both would engage the agent, the
      # first would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom-files-maven${{ inputs.artifact_suffix }}

      # The grype_permit_fail input (or, when unset, the NO_BLOCK_AUDIT_FAIL
      # repository variable) disables failure propagation so pull requests
      # can proceed when blocked by newly discovered CVEs in transitive
      # dependencies.
      - name: 'Grype audit SBOM'
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@9a85f35a26a71dafb2fa23a6f83a640d526ee559  # v0.2.0
        with:
          sbom: 'sbom-cyclonedx.json'
          fail-on: ${{ inputs.grype_fail_on }}
          # yamllint disable-line rule:line-length
          permit-fail: ${{ inputs.grype_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The action's default name, with the suffix that keeps each
          # call's reports apart.
          artifact-name: grype-scan-results${{ inputs.artifact_suffix }}
