---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable Maven build/test (verify) pipeline.
#
# Reproduces the canonical Linux Foundation pipeline shape for a Maven
# project. The repository-metadata job runs in parallel as an
# informational step. After build the jobs in { } run in parallel; none
# gates another, so a PR surfaces every failure (-> denotes sequence):
#   build -> { tests | sbom -> grype }
#
# Java note: Maven binds test execution to the build lifecycle, so the
# build job runs the tests (mvn install) and gates the rest; the tests
# job renders a JUnit summary from the collected reports without
# rebuilding. Dependency vulnerability scanning is provided by the
# SBOM -> Grype leg; Nexus IQ CLM is a separate, dedicated lane.
#
# Call this from a thin caller workflow; see examples/maven/build-test/
# for both a plain GitHub-native caller and a Gerrit-wrapped caller.
name: '[R] Maven Build/Test'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branch/tag/SHA to check out (empty = default branch)'
        required: false
        type: string
        default: ''

      # --- Project layout ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'

      # --- Java / Maven toolchain ---
      java_version:
        description: >-
          OpenJDK version for the build. Empty auto-detects from the
          project (build-metadata-action) and falls back to 21.
        required: false
        type: string
        default: ''
      mvn_version:
        description: 'Maven version to provision'
        required: false
        type: string
        default: '3.9.11'
      mvn_phases:
        description: 'Maven lifecycle phases to run for verification'
        required: false
        type: string
        default: 'clean install'
      mvn_profiles:
        description: 'Comma-delimited list of Maven profiles to activate'
        required: false
        type: string
        default: ''
      mvn_params:
        description: 'Extra parameters appended to the mvn command'
        required: false
        type: string
        default: ''
      run_jacoco:
        description: 'Run JaCoCo coverage during the build'
        required: false
        type: boolean
        default: true

      # --- Tests ---
      test_permit_fail:
        description: >-
          Permit test failures without failing the workflow. Adds
          -Dmaven.test.failure.ignore=true so the build completes, then
          the tests job reports results without failing.
        required: false
        type: boolean
        default: false

      # --- Grype scan ---
      grype_fail_on:
        description: 'Minimum severity that fails the Grype scan'
        required: false
        type: string
        default: 'medium'
      grype_permit_fail:
        description: >-
          Permit Grype findings without failing the job. When false, falls
          back to the NO_BLOCK_AUDIT_FAIL repository variable at runtime.
        required: false
        type: boolean
        default: false

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      build_permit_egress_traffic:
        description: >
          Run harden-runner in audit mode for the build job only,
          permitting unrestricted egress. Use when the build fetches
          dependencies from CDNs that are impractical to enumerate in the
          allow-list. Other jobs stay governed by harden_runner_egress;
          left unset, the build job follows it too.
        required: false
        type: boolean
        default: false
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@f0f76ac22f342c9a788ebcabe584e68a79cc2e83'  # v0.16.0

      # --- Job timeouts (minutes) ---
      # Sized per job rather than uniformly. The build, test-report and
      # audit jobs scale with the size of the project, so they are
      # configurable; the validation and metadata jobs do fixed work and
      # are not. Defaults suit a large multi-module reactor on a busy
      # shared runner, where dependency resolution, image pulls and
      # vulnerability database downloads are all slower than they look
      # locally. They bound a hung job, so erring high costs nothing.
      build_timeout_minutes:
        description: 'Timeout for the build job'
        required: false
        type: number
        default: 45
      tests_timeout_minutes:
        description: 'Timeout for the test reporting job'
        required: false
        type: number
        default: 30
      sbom_timeout_minutes:
        description: 'Timeout for the SBOM generation job'
        required: false
        type: number
        default: 30
      grype_timeout_minutes:
        description: 'Timeout for the Grype scan job'
        required: false
        type: number
        default: 30

      # --- Build artefact publication ---
      # Off by default. The build's packaged output is large and most
      # verify lanes never look at it again, so uploading unconditionally
      # would impose storage on every consumer to serve a minority. Turn
      # it on where a later job, or a human, needs the built output:
      # publish/stage lanes, container builds, CSIT, or downloading a jar
      # from a failed run to reproduce a problem locally.
      upload_build_artifacts:
        description: >-
          Upload the packaged build output as a workflow artefact.
          Prefers the m2repo when a deploy phase produced one, since
          that is the layout publish and stage lanes consume; otherwise
          takes the reactor's packaged output.
        required: false
        type: boolean
        default: false
      build_artifact_retention_days:
        description: >-
          Retention for the build artefact. Shorter than the SBOM's 45
          days: build output is reproducible from the commit, so it is
          a convenience rather than a record.
        required: false
        type: number
        default: 7

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the change under test'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

    secrets:
      # settings.xml commonly carries server credentials (passwords,
      # tokens), so it is accepted only as a secret -- never a plain
      # input -- to keep the value masked in logs and the run UI. The
      # content is typically synthesised by maven-xml-settings-action.
      # Omit it for builds that need no global settings.
      maven_global_settings:
        description: 'Maven global settings.xml content (masked secret)'
        required: false

permissions: {}

jobs:
  gerrit-validate:
    name: 'Validate Gerrit Inputs'
    # Fails fast with a clear message when gerrit_refspec is set without
    # the project/branch the Gerrit checkout path also requires. The
    # build-chain root job depends on this, so invalid Gerrit inputs stop
    # the pipeline early and cleanly. This job always runs (only the
    # validation step is conditional), so gating dependents on it does
    # not trip GitHub's "skipped need skips dependents" behaviour.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

  repository-metadata:
    name: 'Repository Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    timeout-minutes: 10
    steps:
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever
      # a step-level 'if:' says. Both would engage the agent, the
      # first would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2a70c3284392b8d6ee85a509dd4e9818801a7e82  # v0.11.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@8d17362fe9a656744433f3dec7fc60f14b23f858  # v0.2.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'

  build:
    name: 'Build'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    outputs:
      java_version: ${{ steps.metadata.outputs.java_version }}
      coverage: ${{ steps.build.outputs.coverage }}
      branch_coverage: ${{ steps.build.outputs.branch_coverage }}
      reports_found: ${{ steps.reports.outputs.found }}
      # Surfaced so a caller's downstream job can locate the
      # publish-ready repository layout without re-deriving the path.
      m2repo_exists: ${{ steps.build.outputs.m2repo_exists }}
      m2repo_path: ${{ steps.build.outputs.m2repo_path }}
      artifact_count: ${{ steps.build.outputs.artifact_count }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    steps:
      # The build job can opt into audit egress independently of the
      # other jobs via build_permit_egress_traffic, for dependency
      # fetches from CDNs impractical to enumerate in the allow-list.
      # Left unset it follows harden_runner_egress like every other job.
      #
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever
      # a step-level 'if:' says. Both would engage the agent, the
      # first would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2a70c3284392b8d6ee85a509dd4e9818801a7e82  # v0.11.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ (inputs.build_permit_egress_traffic || inputs.harden_runner_egress == 'audit') && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Detect Java/Maven project metadata: Java version (including
      # maven.compiler.release plus parent/reactor resolution), module
      # layout, version.properties and any releases/*.yaml. Lets the
      # build pick the Java version when the caller does not pin one.
      # The action takes no github_summary input; one was passed here
      # until it was noticed in the run annotations, ignored throughout.
      - name: 'Detect build metadata'
        id: metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/build-metadata-action@504ee845e954566de1d220137fd40635e15468a9  # v0.8.0
        with:
          path_prefix: ${{ inputs.path_prefix }}

      - name: 'Build with Maven'
        id: build
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/maven-build-action@4fe48909bcb696f286d83b197d84fbb64b4e020e  # v0.4.0
        with:
          path_prefix: ${{ inputs.path_prefix }}
          # Caller override wins, else the detected version, else 21.
          # yamllint disable-line rule:line-length
          java-version: ${{ inputs.java_version != '' && inputs.java_version || steps.metadata.outputs.java_version || '21' }}
          mvn-version: ${{ inputs.mvn_version }}
          mvn-phases: ${{ inputs.mvn_phases }}
          mvn-profiles: ${{ inputs.mvn_profiles }}
          # When test failures are permitted, let Maven complete the build
          # (so artefacts and reports are produced) and defer the pass/fail
          # verdict to the tests job's report gate.
          # yamllint disable-line rule:line-length
          mvn-params: ${{ inputs.test_permit_fail && format('{0} -Dmaven.test.failure.ignore=true', inputs.mvn_params) || inputs.mvn_params }}
          global-settings: ${{ secrets.maven_global_settings }}
          run-jacoco: ${{ inputs.run_jacoco }}

      - name: 'Collect JUnit reports'
        id: reports
        if: always()
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          # Copy Surefire/Failsafe XML out of the reactor so the tests
          # job can render a summary without rebuilding the project.
          set -euo pipefail
          dest="junit-reports"
          found=0
          while IFS= read -r -d '' f; do
            rel="${f#"${PATH_PREFIX}/"}"
            mkdir -p "${dest}/$(dirname "${rel}")"
            cp "${f}" "${dest}/${rel}"
            found=1
          done < <(find "${PATH_PREFIX}" -type f \
            -path '*/target/*-reports/*.xml' -print0)
          echo "found=${found}" >> "$GITHUB_OUTPUT"
          echo "Collected JUnit reports (found=${found})"

      - name: 'Upload JUnit reports'
        if: ${{ always() && steps.reports.outputs.found == '1' }}
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: maven-junit-reports
          path: junit-reports
          if-no-files-found: warn

      # Two shapes can come out of a Maven build and they are not
      # interchangeable. A deploy phase writes a repository layout to
      # m2repo (groupId/artifactId/version/...), which is what Nexus
      # staging and publish consume. Any other phase leaves packaged
      # output scattered through the reactor's target/ directories.
      # Prefer the former when it exists and say which was taken, so a
      # consumer downloading the artefact knows what it has.
      - name: 'Collect build artefacts'
        id: build-artifacts
        if: ${{ always() && inputs.upload_build_artifacts }}
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          M2REPO_EXISTS: ${{ steps.build.outputs.m2repo_exists }}
          M2REPO_PATH: ${{ steps.build.outputs.m2repo_path }}
        run: |
          # Stage the build output under a single directory for upload.
          set -euo pipefail
          dest="build-artifacts"
          shape="none"
          count=0

          # Take the location from the build action rather than
          # re-deriving it, so the layout stays the action's business.
          if [ "${M2REPO_EXISTS}" = "true" ] && [ -n "${M2REPO_PATH}" ] \
             && [ -d "${M2REPO_PATH}" ]; then
            shape="m2repo"
            mkdir -p "${dest}"
            cp -R "${M2REPO_PATH}" "${dest}/m2repo"
            count=$(find "${dest}/m2repo" -type f \
              \( -name '*.jar' -o -name '*.war' -o -name '*.ear' \
                 -o -name '*.pom' \) | wc -l | tr -d ' ')
          else
            # No deploy phase ran. Take the reactor's packaged output:
            # files sitting directly in a module's target/ directory,
            # not the compiled classes or unpacked dependencies below it.
            shape="reactor"
            while IFS= read -r -d '' dir; do
              for f in "${dir}"/*.jar "${dir}"/*.war "${dir}"/*.ear; do
                [ -f "${f}" ] || continue
                rel="${f#"${PATH_PREFIX}/"}"
                mkdir -p "${dest}/$(dirname "${rel}")"
                cp "${f}" "${dest}/${rel}"
                count=$((count + 1))
              done
            done < <(find "${PATH_PREFIX}" -type d -name target -print0)
          fi

          if [ "${count}" -eq 0 ]; then
            shape="none"
          fi

          {
            echo "shape=${shape}"
            echo "count=${count}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build artefacts"
            echo ""
            echo "| Property | Value |"
            echo "| -------- | ----- |"
            echo "| Layout | ${shape} |"
            echo "| Files | ${count} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Collected ${count} file(s) as '${shape}' layout"

      - name: 'Upload build artefacts'
        # yamllint disable-line rule:line-length
        if: ${{ always() && inputs.upload_build_artifacts && steps.build-artifacts.outputs.count != '0' }}
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # yamllint disable-line rule:line-length
          name: maven-build-artifacts-${{ steps.build-artifacts.outputs.shape }}
          path: build-artifacts
          retention-days: ${{ inputs.build_artifact_retention_days }}
          if-no-files-found: error

  tests:
    name: 'Tests'
    runs-on: ubuntu-latest
    needs: 'build'
    # Run whenever build was not skipped, INCLUDING a failed build: Maven
    # runs the tests during the build, so a test failure fails the build
    # job. The report must still render, so gate on 'not skipped' rather
    # than 'success'.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.tests_timeout_minutes }}
    steps:
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever
      # a step-level 'if:' says. Both would engage the agent, the
      # first would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2a70c3284392b8d6ee85a509dd4e9818801a7e82  # v0.11.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Maven runs the unit tests during the build (mvn install), which
      # already gates this job. This job only renders a JUnit summary
      # from the XML the build job collected, so it does not check out
      # the source tree; it consumes the downloaded artefact instead.
      - name: 'Download JUnit reports'
        if: ${{ needs.build.outputs.reports_found == '1' }}
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: maven-junit-reports
          path: junit-reports

      - name: 'Summarise test results'
        if: ${{ needs.build.outputs.reports_found == '1' }}
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/junit-test-report-action@8b93aedff045366029288e976026290d4dc9b349  # v0.0.1
        with:
          report-paths: 'junit-reports/**/*.xml'
          fail-on-failure: ${{ !inputs.test_permit_fail }}
          # The build job already uploads the XML as maven-junit-reports;
          # disable the action's own upload to avoid a duplicate artefact.
          artifact-upload: 'false'

      - name: 'No test reports'
        if: ${{ needs.build.outputs.reports_found != '1' }}
        shell: bash
        run: |
          # The build produced no Surefire/Failsafe XML (a project with
          # no tests, or a build that stopped before the test phase).
          echo 'No JUnit reports were produced by the build'

  sbom:
    name: 'Generate SBOM'
    runs-on: ubuntu-latest
    needs: 'build'
    # Runs whenever build was not skipped: the SBOM job does its own
    # checkout and does not depend on the build's artefacts, so it keeps
    # producing the dependency-scan signal even when the build fails
    # (for example on a test failure).
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    timeout-minutes: ${{ inputs.sbom_timeout_minutes }}
    permissions:
      contents: read
    steps:
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever
      # a step-level 'if:' says. Both would engage the agent, the
      # first would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2a70c3284392b8d6ee85a509dd4e9818801a7e82  # v0.11.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Generate a real CycloneDX SBOM with syft (static analysis of the
      # checked-out tree). The defaults emit sbom-cyclonedx.json and
      # sbom-cyclonedx.xml at the workspace root; the JSON document is the
      # Grype job's scan contract. The action writes its own SBOM summary
      # to the job summary, including the component count.
      - name: 'Generate SBOM'
        id: sbom
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/sbom-action@df0b04bb49f19c0dca5e6e08a0c9080bf55d261e  # v0.0.1
        with:
          path_prefix: ${{ inputs.path_prefix }}

      - name: 'Upload SBOM artifacts'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Lane-specific: a caller invoking both the Maven and Gradle
          # workflows shares one run, and so one artifact namespace.
          # Duplicate names are permitted and both uploads persist as
          # separate artifacts, but download-artifact resolves a name
          # to the newest match, so a shared 'sbom-files' had both
          # Grype jobs scan whichever lane happened to upload last.
          name: sbom-files-maven
          # Glob matches whichever SBOM formats the generator produced
          path: sbom-cyclonedx.*
          retention-days: 45
          # Fail fast: the downstream Grype job requires this artifact,
          # so a missing/misnamed SBOM must surface here, not later
          if-no-files-found: error

  grype:
    name: 'Grype Audit SBOM'
    runs-on: ubuntu-latest
    needs: 'sbom'
    if: ${{ !cancelled() && needs.sbom.result == 'success' }}
    timeout-minutes: ${{ inputs.grype_timeout_minutes }}
    permissions:
      contents: read
      issues: read  # Read maintainer-approved CVE bypass issues
    steps:
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever
      # a step-level 'if:' says. Both would engage the agent, the
      # first would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2a70c3284392b8d6ee85a509dd4e9818801a7e82  # v0.11.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom-files-maven

      # The grype_permit_fail input (or, when unset, the NO_BLOCK_AUDIT_FAIL
      # repository variable) disables failure propagation so pull requests
      # can proceed when blocked by newly discovered CVEs in transitive
      # dependencies.
      - name: 'Grype audit SBOM'
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@87fd7bdad7f0809af58108e65f60debc244df348  # v0.0.2
        with:
          sbom: 'sbom-cyclonedx.json'
          fail-on: ${{ inputs.grype_fail_on }}
          # yamllint disable-line rule:line-length
          permit-fail: ${{ inputs.grype_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
